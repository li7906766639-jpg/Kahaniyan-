      {role:'user', content:'[HINT] Ab user ke liye 3 alag chhote reply suggest karo (har ek 12 shabdon se kam, user ki taraf se, dialogue ya *action*). Har suggestion nayi line par, bina number ya prefix ke. Sirf 3 lines.'}]);

function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Is browser mein voice typing nahi hai'); return; }
  if(S.rec){ try{ S.rec.stop(); }catch(e){} return; }
  const r = new SR(), inp = $('#inp'), base = inp.value;
  r.lang = 'hi-IN'; r.interimResults = true; r.continuous = false;
  r.onresult = e => { let t = ''; for(const x of e.results) t += x[0].transcript; inp.value = (base + ' ' + t).trim().slice(0, MSG_MAX); autosize(); syncAct(); };
  r.onend = () => { S.rec = null; syncAct(); };
  r.onerror = ev => { toast(ev.error === 'not-allowed' ? 'Mic ki permission do' : 'Awaaz sun nahi paya'); };
  S.rec = r; try{ r.start(); }catch(e){ S.rec = null; } syncAct();
}
/* Message ko ladki ki awaaz mein padh kar sunana - phone ki apni built-in awaaz
   use hoti hai (Web Speech API), bilkul free, koi key ya internet nahi chahiye. */
let voiceCache = {}, voicesReady = false;
function pickVoiceByGender(gender){
  if(voiceCache[gender]) return voiceCache[gender];
  const voices = speechSynthesis.getVoices();
  if(!voices.length) return null;
  const hi = voices.filter(v => /^hi/i.test(v.lang));
  const pool = hi.length ? hi : voices.filter(v => /^en/i.test(v.lang));
  const list = pool.length ? pool : voices;
  let v;
  if(gender === 'male') v = list.find(x => /male/i.test(x.name) && !/female/i.test(x.name)) || list.find(x => !/female|woman/i.test(x.name)) || list[0];
  else v = list.find(x => /female|woman|women/i.test(x.name)) || list.find(x => !/\bmale\b/i.test(x.name)) || list[0];
  voiceCache[gender] = v; return v;
}
function ensureVoices(){
  return new Promise(resolve => {
    if(speechSynthesis.getVoices().length){ voicesReady = true; resolve(); return; }
    speechSynthesis.onvoiceschanged = () => { voicesReady = true; resolve(); };
    setTimeout(resolve, 800);
  });
}
async function elevenlabsSpeak(text, cfg){
  const res = await fetch(cfg.base + '/' + cfg.voiceId, {
    method:'POST', headers:{'Content-Type':'application/json', 'xi-api-key':cfg.key},
    body: JSON.stringify({text, model_id:'eleven_multilingual_v2', voice_settings:{stability:0.35, similarity_boost:0.85, style:0.4, use_speaker_boost:true}})
  });
  if(!res.ok) throw new Error('Voice API error ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
function stopSpeaking(){
  if(S.audioEl){ try{ S.audioEl.pause(); }catch(e){} S.audioEl = null; }
  if('speechSynthesis' in window) speechSynthesis.cancel();
  S.speakingId = null;
}
async function speakMsg(mid){
  if(S.speakingId === mid){ stopSpeaking(); paintMsgs(S.chatId); return; }
  stopSpeaking();
  const c = S.chats[S.chatId]; const m = c && c.messages.find(x => x.id === mid);
  const text = (m ? m.t : '').replace(/\*/g, '').trim();
  if(!text) return;
  const localKey = (typeof store !== 'undefined' ? store.get('kcs.voiceKey', '') : '') || '';
  const voiceCfg = localKey
    ? {key:localKey, voiceId:(store.get('kcs.voiceId', '') || FIXED_VOICE.voiceId), base:FIXED_VOICE.base, kind:FIXED_VOICE.kind}
    : (FIXED_VOICE.key ? FIXED_VOICE : null);
  S.speakingId = mid; paintMsgs(S.chatId);
  if(voiceCfg && voiceCfg.kind === 'elevenlabs'){
    try{
      const url = await elevenlabsSpeak(text, voiceCfg);
      const audio = new Audio(url); S.audioEl = audio;
      audio.onended = () => { S.speakingId = null; S.audioEl = null; paintMsgs(S.chatId); URL.revokeObjectURL(url); };
      audio.onerror = () => { S.speakingId = null; S.audioEl = null; paintMsgs(S.chatId); toast('Awaaz load nahi ho payi'); URL.revokeObjectURL(url); };
      await audio.play(); return;
    }catch(e){ toast('Premium awaaz nahi mil payi, phone ki awaaz use kar rahe hain'); }
  }
  if(!('speechSynthesis' in window)){ S.speakingId = null; paintMsgs(S.chatId); toast('Is browser mein awaaz sunna support nahi hai'); return; }
  await ensureVoices();
  const gender = INFO.voiceGender || 'female';
  const v = pickVoiceByGender(gender);
  const u = new SpeechSynthesisUtterance(text);
  u.lang = (v && v.lang) || 'hi-IN';
  if(v) u.voice = v;
  u.rate = INFO.voiceRate || 1; u.pitch = gender === 'male' ? 0.95 : 1.05;
  u.onend = () => { S.speakingId = null; paintMsgs(S.chatId); };
  u.onerror = () => { S.speakingId = null; paintMsgs(S.chatId); toast('Awaaz mein dikkat aayi'); };
  speechSynthesis.speak(u);
}

}

    if(kind === 'open') text = (story(S.chatId).opening || '').replace(/\{user\}/g, S.set.name);
    else { const c = S.chats[S.chatId]; const m = c && c.messages.find(x => x.id === mid); text = m ? m.t : ''; }
    const plain = text.replace(/\*/g, '');
    const ok = await copyText(plain);
    closeOv(() => toast(ok ? 'Copy ho gaya' : 'Copy nahi ho paya. Phone ki clipboard permission check karo.'));
  },
  delMsg: el => { const mid = el.dataset.mid; closeOv(() => {
    if(S.busy && mid === S.curMsgId){ toast('Jawab abhi likha ja raha hai, thodi der ruko'); return; }
    if(!confirm('Ye message delete karna hai?')) return;
    const c = S.chats[S.chatId]; c.messages = c.messages.filter(x => x.id !== mid); saveChats(); paintMsgs(S.chatId, true);
  }); },
  restart: () => closeOv(() => {
    if(S.busy) return;
    if(!confirm('Kahani shuru se start hogi. Purani chat hat jayegi. Aage badhein?')) return;
    const sp = showMiniSpinner();
    const rid = S.chatId;
    setTimeout(() => { sp.remove(); S.chats[rid] = {messages:[], updated:Date.now()}; saveChats(); forgetChats([rid]); render(); toast('Kahani restart ho gayi'); }, 900);
  }),
  delchat: () => closeOv(() => {
    if(S.busy) return;
    if(!confirm('Ye chat hamesha ke liye delete ho jayegi. Aage badhein?')) return;
    const sp = showMiniSpinner();
    const did = S.chatId;
    setTimeout(() => { sp.remove(); delete S.chats[did]; saveChats(); forgetChats([did]); history.back(); toast('Chat delete ho gayi'); }, 900);
  })
};
document.addEventListener('click', e => {
  if(e.target === $('#sheet')){ closeOv(); return; }
  if(S.ov === 'menu' && !e.target.closest('#menu') && !e.target.closest('[data-a="menu"]')){ closeOv(); return; }
  const el = e.target.closest('[data-a]'); if(!el) return;
  const f = ACT[el.dataset.a]; if(f) f(el);
});
let holdTimer = null, holdEl = null, holdX = 0, holdY = 0;
function holdCancel(){ if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; } if(holdEl){ holdEl.classList.remove('pressed'); holdEl = null; } }
document.getElementById('app').addEventListener('pointerdown', e => {
  const row = e.target.closest('#msgs [data-mid]'); if(!row) return;
  holdEl = row.querySelector('.bub') || row; holdX = e.clientX; holdY = e.clientY;
  holdTimer = setTimeout(() => { if(holdEl){ holdEl.classList.add('pressed'); if(navigator.vibrate) navigator.vibrate(12); openMsgMenu(row); } holdTimer = null; }, 480);
});
document.getElementById('app').addEventListener('pointermove', e => { if(holdTimer && (Math.abs(e.clientX - holdX) > 10 || Math.abs(e.clientY - holdY) > 10)) holdCancel(); });
document.getElementById('app').addEventListener('pointerup', holdCancel);
document.getElementById('app').addEventListener('pointerleave', holdCancel);
document.getElementById('app').addEventListener('contextmenu', e => { if(e.target.closest('#msgs [data-mid]')) e.preventDefault(); });
function openMsgMenu(row){
  const kind = row.dataset.kind, mid = row.dataset.mid;
  openOv('sheet', `<h2>Message</h2>
    <button class="btn ghost" data-a="copyMsg" data-mid="${esc(mid)}" data-kind="${kind}">Copy karo</button>
    ${kind !== 'open' ? `<button class="btn danger" data-a="delMsg" data-mid="${esc(mid)}">Delete karo</button>` : ''}
    <button class="btn ghost" data-a="closeOv">Cancel</button>`);
}
document.addEventListener('input', e => {
  if(e.target.id === 'q'){ S.q = e.target.value; $('#results').innerHTML = searchResults(); }
  if(e.target.id === 'inp'){ autosize(); syncAct(); }
});
document.addEventListener('change', e => {
  if(e.target.id === 'wAge'){
    S.wAge = !!e.target.checked;
    const b = document.querySelector('[data-a="finishWelcome"]');
    if(b){ if(S.user && S.wAge) b.removeAttribute('aria-disabled'); else b.setAttribute('aria-disabled', 'true'); }
    return;
  }
  if(e.target.id === 'fProvider'){
    const p = PROVIDERS[e.target.value] || PROVIDERS.custom;
    if($('#fBase')) $('#fBase').value = p.base;
    if($('#fModel')) $('#fModel').value = p.model;
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && S.ov) closeOv();
});

/* ---------- boot ---------- */
async function boot(){
  loadInfoLocal();
  try{ const sc = await splashCacheGet(); if(sc && Array.isArray(sc.photos) && sc.photos.length) INFO.splashPhotos = sc.photos; }catch(e){}
  runSplash();
  try{ const c = await idb.get('creator'); if(c) C = Object.assign({edits:{}, custom:[]}, c); }catch(e){}
  try{ const r = await fetch('content.json', {cache:'no-cache'}); if(r.ok){ const j = await r.json(); R = {edits:j.edits || {}, custom:j.custom || []}; } }catch(e){}
  invalidate();
  if(S.view === 'home' || S.view === 'search' || S.view === 'chats'){ if(!S.ov) render(); }
  if(FIXED_FB_CONFIG) initFirebase(FIXED_FB_CONFIG);
}
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
applyTheme();
history.replaceState({root:1}, '');
history.pushState({app:1, view:'home'}, '');
render(); checkOrient(); tryLock();
boot();
</script>
</body>
</html>
