<!DOCTYPE html>
<html lang="hi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d0d0f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kahaniyon Chat Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js" onerror="window.__fbLoadFailed=true"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js" onerror="window.__fbLoadFailed=true"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js" onerror="window.__fbLoadFailed=true"></script>
<style>
:root,[data-theme="dark"]{
  --bg:#0d0d0f; --surface:#19191c; --surface2:#23262d; --line:#2a2a2f; --text:#f5f2ee; --muted:#8d8b89;
  --bar:#111114; --ai:#242830; --ai-text:#f1eeea; --em:#a9aebb; --gold:#e7c26b; --red:#e5322d; --red-dim:#7a1f1d; --nar:rgba(255,255,255,.05);
  --doodle:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170' viewBox='0 0 170 170' fill='none' stroke='%23ffffff' stroke-opacity='.06' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M30 40c-8-10 4-20 10-10 6-10 18 0 10 10l-10 12z'/><circle cx='118' cy='34' r='9'/><path d='M126 104l4 9 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z'/><path d='M28 118h20v15H28zM33 118l2-5h8l2 5'/><circle cx='38' cy='126' r='3.5'/><path d='M84 148c0-9 14-9 14 0M100 70h16M108 62v16'/></svg>");
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#f6f3ee; --surface:#ffffff; --surface2:#ebe8e2; --line:#dcd7cf; --text:#1b1a19; --muted:#6c6862;
  --bar:#ffffff; --ai:#e6e9ef; --ai-text:#1b1a19; --em:#5d6270; --gold:#8a5d00; --nar:rgba(0,0,0,.04);
  --doodle:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170' viewBox='0 0 170 170' fill='none' stroke='%23000000' stroke-opacity='.07' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M30 40c-8-10 4-20 10-10 6-10 18 0 10 10l-10 12z'/><circle cx='118' cy='34' r='9'/><path d='M126 104l4 9 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z'/><path d='M28 118h20v15H28zM33 118l2-5h8l2 5'/><circle cx='38' cy='126' r='3.5'/><path d='M84 148c0-9 14-9 14 0M100 70h16M108 62v16'/></svg>");
  color-scheme:light;
}
:root{
  --display:"Yatra One",Georgia,"Times New Roman",serif;
  --body:"Hind",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;overscroll-behavior-y:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:relative;max-width:480px;height:100%;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-top:var(--safe-t)}
#screen.chat{overflow:hidden;display:flex;flex-direction:column}

.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px}
.logo{margin:0;font-family:var(--display);font-weight:400;font-size:34px;letter-spacing:.5px;line-height:1;user-select:none;-webkit-user-select:none}
.avatar-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold)}
.tabs{display:flex;gap:26px;padding:10px 20px 0;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 0 12px;font-size:18px;font-weight:600;color:var(--muted);white-space:nowrap;position:relative}
.tab[aria-selected="true"]{color:var(--text)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--red)}
.pad{padding:16px 20px 24px}
.h2{font-size:24px;font-weight:700;margin:26px 0 14px}

.cover{position:relative;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 70% at 75% 0%,color-mix(in srgb,var(--glow) 38%,transparent),transparent 62%),linear-gradient(165deg,var(--c1),var(--c2))}
.cover.has-img{background-size:cover;background-position:center;background-color:#000}
.cover-sym{position:absolute;width:78%;left:11%;top:22%;opacity:.22;z-index:-1}
.cover-title{font-family:var(--display);color:#e7c26b;line-height:1.02}
.cover-sub{color:rgba(255,255,255,.8)}


.herorail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 2px;scrollbar-width:none}
.herorail::-webkit-scrollbar{display:none}
.herorail .hero{flex:0 0 80%;scroll-snap-align:start}
.hero{border-radius:22px;aspect-ratio:4/5;display:flex;flex-direction:column;padding:22px 20px 18px;box-shadow:0 0 0 1px rgba(255,255,255,.05);color:#fff}
.hero .chip{align-self:flex-start;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.18);margin-bottom:10px;color:#fff}
.hero .cover-title{font-size:clamp(38px,12.5vw,58px)}
.hero .cover-sub{font-size:17px;margin-top:10px;max-width:16em}
.hero .spacer{flex:1}
.start{width:100%;padding:15px;border-radius:16px;background:rgba(40,40,44,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:19px;font-weight:700;letter-spacing:.3px;border:1px solid rgba(255,255,255,.12);color:#fff}
.start:active{background:var(--red)}

.rail{display:flex;gap:16px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail-item{flex:0 0 84px;text-align:center}
.rail-item .cover{width:78px;height:78px;border-radius:50%;margin:0 auto 8px;border:2px solid var(--red-dim)}
.rail-item .cover-sym{width:70%;left:15%;top:15%;opacity:.5}
.rail-item span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;font-weight:600;line-height:1.25}
.empty{color:var(--muted);font-size:15px;padding:6px 0}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{text-align:left}
.card .cover{aspect-ratio:3/4;border-radius:16px;padding:14px 12px;display:flex;flex-direction:column}
.card .cover-title{font-size:24px}
.card .cover-sub{font-size:12.5px;margin-top:auto}
.card b{display:block;margin-top:8px;font-size:15px}
.card small{color:var(--muted);font-size:13px}
.row-item{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row-item .cover{flex:0 0 70px;height:92px;border-radius:12px}
.row-item .cover-sym{width:80%;left:10%;top:20%}
.row-item .meta{flex:1;min-width:0}
.row-item .t{font-size:18px;font-weight:700}
.row-item .g{font-size:13px;color:var(--gold)}
.row-item .s{font-size:14px;color:var(--muted);margin-top:2px}
.rank{flex:0 0 26px;font-family:var(--display);font-size:26px;color:var(--muted);text-align:center}
.rank.top3{color:var(--gold)}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--red);margin-left:6px;vertical-align:middle;color:#fff}
.pill-btn{padding:8px 14px;border-radius:99px;background:var(--surface2);font-weight:600;font-size:14px;white-space:nowrap}

.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:8px}
.search input{flex:1;height:48px;background:none;border:0;color:var(--text);font:inherit;font-size:17px;outline-offset:6px}
.search svg{color:var(--muted);flex:0 0 auto}

#nav{display:flex;border-top:1px solid var(--line);background:var(--bar);padding-bottom:var(--safe-b)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;color:var(--muted);font-size:14px;font-weight:600}
#nav button[aria-current="page"]{color:var(--text)}
#nav.hide{display:none}

.cbar{margin:10px 20px 0;padding:12px 14px;border-radius:14px;background:#2a1f10;border:1px solid #5a4218;color:#f3e2bd}
.cbar b{display:block;margin-bottom:8px}
.cbar .acts{display:flex;gap:8px;flex-wrap:wrap}
.cbar .pill-btn{background:#3b2d16;color:#f3e2bd}

/* chat */
.chat-head{display:flex;align-items:center;gap:8px;padding:10px 10px;border-bottom:1px solid var(--line);background:var(--bar)}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:0 0 auto}
.icon-btn:active{background:var(--surface2)}
.hav{position:relative;flex:0 0 46px;height:46px}
.hav .cover{width:46px;height:46px;border-radius:50%}
.hav .cover-sym{width:70%;left:15%;top:15%;opacity:.5}
.hav .dot{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:#22c55e;border:2px solid var(--bar)}
.chat-head .who{flex:1;min-width:0;padding-left:2px}
.chat-head .who b{display:block;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .who small{color:var(--muted);font-size:14px}
.chatbody{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
#msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 10px;display:flex;flex-direction:column;gap:12px;background-color:var(--bg);background-image:var(--doodle)}
.pw{text-align:center;color:var(--muted);font-size:16px;padding:6px 0 0}
.about{border:1px solid var(--line);border-radius:22px;background:var(--surface);padding:14px}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.strip::-webkit-scrollbar{display:none}
.shot{flex:0 0 46%;aspect-ratio:1/1.12;border-radius:16px;background-size:cover;background-position:center;background-color:var(--surface2)}
.shot.poster{padding:14px 12px;display:flex;flex-direction:column}
.shot.poster .cover-title{font-size:26px}
.shot.poster .cover-sub{font-size:12.5px;margin-top:auto}
.about h3{margin:16px 6px 4px;font-size:22px;font-weight:600}
.about p{margin:0 6px;font-size:18px;line-height:1.5;white-space:pre-wrap}
.price{display:flex;align-items:center;gap:10px;width:max-content;margin:16px auto 4px;background:var(--surface2);border-radius:99px;padding:8px 22px 8px 12px;font-size:18px;color:var(--muted)}
.coin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#f5b300;color:#5a3a00;font-weight:700;font-size:18px;border:3px solid #ffcf3d}
.about .edit-row{margin:12px 6px 0}
.row{display:flex;max-width:100%}
.row.u{justify-content:flex-end}
.msgActs{display:flex;gap:4px;margin:-4px 0 2px 4px}
.msgActs button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.msgActs button:active{background:var(--surface2);color:var(--text)}
.msgActs button:disabled{opacity:.4}
.bub{max-width:88%;padding:14px 16px;border-radius:20px;font-size:17px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.a{background:var(--ai);color:var(--ai-text);border-bottom-left-radius:8px}
.bub.a em{color:var(--em)}
.bub.u{background:var(--user-bubble,var(--red));color:#fff;border-bottom-right-radius:8px;max-width:82%}
.bub .pic{display:block;width:100%;border-radius:14px;margin-bottom:10px;cursor:zoom-in}
.typing{display:flex;gap:5px;padding:18px 18px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.err{background:#2a1414;color:#f5e6e4;border:1px solid var(--red-dim);border-radius:14px;padding:12px 14px;font-size:15px}
.err .acts{display:flex;gap:8px;margin-top:10px}
.err .pill-btn{background:#3a1e1e;color:#fff}
.down{position:absolute;right:14px;bottom:10px;width:46px;height:46px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.down[hidden]{display:none}
.composer{padding:8px 12px calc(10px + var(--safe-b));background:var(--bg)}
.tray{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;align-items:center}
.tray:empty{display:none}
.tray::-webkit-scrollbar{display:none}
.chip-btn{flex:0 0 auto;padding:8px 14px;border-radius:99px;border:1px solid var(--line);font-size:15px;font-weight:500;background:var(--surface);max-width:78vw;text-align:left}
.chip-btn.go{background:var(--red);border-color:var(--red);font-weight:700;color:#fff}
.chip-btn em{color:var(--em)}
.tray .muted{color:var(--muted);font-size:14px;padding:6px 4px}
.inputrow{display:flex;gap:10px;align-items:flex-end}
.pillfield{flex:1;min-width:0;display:flex;align-items:flex-end;background:var(--surface2);border-radius:27px;padding:0 4px 0 20px}
.pillfield:focus-within{outline:2px solid var(--gold)}
.pillfield textarea{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;font-size:17px;padding:14px 0;resize:none;max-height:120px;outline:0;line-height:1.3}
.bulb{flex:0 0 46px;height:54px;display:grid;place-items:center;color:var(--text)}
.round{flex:0 0 54px;height:54px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--text)}
.round.send{background:var(--red);color:#fff}
.round.rec{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,50,45,.5)}50%{box-shadow:0 0 0 10px rgba(229,50,45,0)}}

/* overlays */
#sheet{position:absolute;inset:0;z-index:20;display:none;align-items:flex-end;background:rgba(0,0,0,.6)}
#menu{position:absolute;z-index:26;display:none;min-width:236px;max-width:80vw;background:#1c1c20;border-radius:18px;box-shadow:0 14px 34px rgba(0,0,0,.5);border:1px solid var(--line);overflow:hidden}
[data-theme="light"] #menu{background:#ffffff}
#menu.open{display:block}
.mrow{display:flex;align-items:center;gap:13px;padding:13px 16px;width:100%;text-align:left;color:var(--text);font-size:16.5px}
.mrow:active{background:var(--surface2)}
.mrow.danger{color:#ff5850}
.mrow .ic{flex:0 0 22px;display:grid;place-items:center;color:inherit}
.mrow .grow{flex:1;min-width:0}
.mrow .grow small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.mrow .grow b{font-weight:700}
.mdiv{height:1px;background:var(--line)}
.coin2{width:24px;height:24px;border-radius:50%;background:#f5b300;color:#5a3a00;font-weight:700;font-size:13px;display:grid;place-items:center;border:2px solid #ffcf3d}
.bub,.pw~.about .strip,.chat-head .who{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.bub.pressed{filter:brightness(.82)}
.prof-row{display:flex;align-items:center;gap:16px;padding:10px 0 8px}
.prof-av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:26px;font-weight:700;flex:0 0 auto}
.prof-name{font-size:21px}
.prof-sub{color:var(--muted);font-size:14.5px;margin-top:2px}
.coincard{display:flex;align-items:center;gap:14px;background:linear-gradient(100deg,#2c2308,#1a1610);border:1px solid #4a3a12;border-radius:18px;padding:16px 18px;margin-top:18px}
[data-theme="light"] .coincard{background:linear-gradient(100deg,#fff3d6,#fdebc0);border-color:#f0d99a}
.coincard .coin.big{width:46px;height:46px;font-size:20px;border-radius:50%;background:#f5b300;color:#5a3a00;font-weight:700;display:grid;place-items:center;border:3px solid #ffcf3d;flex:0 0 auto}
.coincard small{display:block;color:var(--muted);font-size:13.5px}
.coincard b{font-size:26px}
.plist{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:4px}
.prow{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;text-align:left;font-size:16.5px;border-bottom:1px solid var(--line);color:var(--text)}
.prow:last-child{border-bottom:0}
.prow:active{background:var(--surface2)}
.prow .grow{flex:1}
.prow.danger{color:#ff5850;margin-top:16px;border:1px solid var(--red-dim);border-radius:14px}
.madewith{text-align:center;color:var(--muted);font-size:15px;margin-top:26px}
.verline{text-align:center;color:#5f5c58;font-size:12.5px;line-height:1.6;margin:4px 0 10px}
.faqlist details{border-bottom:1px solid var(--line);padding:12px 2px}
.faqlist summary{font-weight:600;font-size:16px;cursor:pointer;list-style:none}
.faqlist summary::-webkit-details-marker{display:none}
.faqlist p{color:var(--muted);font-size:15px;margin:8px 0 0}
.linklist a{display:block;color:var(--text);text-decoration:none;background:var(--surface2);border-radius:12px;padding:13px 16px;margin-bottom:10px;font-weight:600}
#sheet.open{display:flex}
.sheet-body{width:100%;max-height:92%;overflow-y:auto;background:var(--bar);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + var(--safe-b));border-top:1px solid var(--line)}
.sheet-body h2{margin:0 0 4px;font-size:22px}
.sheet-body p{margin:0 0 14px;color:var(--muted);font-size:14.5px}
#lb{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.94)}
#splash{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);opacity:1;transition:opacity .4s}
#splash.show{display:flex}
#splash.fade{opacity:0}
#splashImg{width:132px;height:132px;border-radius:30px;object-fit:cover;box-shadow:0 14px 34px rgba(0,0,0,.45);transition:.3s}
#splashImg.wide{width:86%;height:70%;border-radius:20px}
#splashName{font-family:var(--display);font-size:30px;color:var(--text);text-align:center;letter-spacing:.5px;padding:0 20px;transition:opacity .3s}
#splashName:empty{display:none}
#lb.open{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:16px;height:46px}
.field textarea{height:auto;min-height:92px;padding:10px 14px;resize:vertical;line-height:1.4}
.field small{display:block;color:var(--muted);font-size:13px;margin-top:5px}
.pwrow{display:flex;align-items:center;gap:8px}
.pwrow input{flex:1}
.eyeBtn{flex:0 0 42px;height:46px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px}
.eyeBtn.on{color:var(--text)}
.gpick-row{display:flex;gap:8px;flex-wrap:wrap}
.gpick{padding:10px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14.5px;font-weight:600;color:var(--text)}
.gpick.on{background:var(--red);border-color:var(--red);color:#fff}
.notice{background:#2a1f10;color:#f3e2bd;border:1px solid #5a4218;border-radius:12px;padding:10px 12px;font-size:14.5px;margin-bottom:14px;display:none}
.notice.on{display:block}
.btn{width:100%;height:48px;border-radius:14px;font-weight:700;font-size:17px;background:var(--red);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--text);margin-top:10px}

function fileToDataUrl(file, max, q){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width * k), h = Math.round(img.height * k);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = () => rej(new Error('img')); img.src = fr.result;
    };
    fr.onerror = () => rej(new Error('read')); fr.readAsDataURL(file);
  });
}

/* ---------- cover art ---------- */
const symSvg = (s, cls) => `<svg class="${cls}" viewBox="0 0 100 100" fill="none" stroke="${s.glow}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${SYM[s.sym] || SYM.pin}</svg>`;
function cv(s, cls, inner, kind){
  const img = kind === 'avatar' ? (s.avatar || (s.images && s.images[0])) : ((s.images && s.images[0]) || s.avatar);
  const base = `--c1:${s.c1};--c2:${s.c2};--glow:${s.glow}`;
  if(img) return `<div class="cover has-img ${cls || ''}" style="${base};background-image:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.6)),url('${img}')">${inner || ''}</div>`;
  return `<div class="cover ${cls || ''}" style="${base}">${symSvg(s,'cover-sym')}${inner || ''}</div>`;
}
const coverTitle = s => `<div class="cover-title">${esc(s.title)}</div><div class="cover-sub">${esc(s.sub)}</div>`;

/* ---------- home / search / chats views ---------- */
const TABS = [['foryou','For you'],['new','New release'],['top','Top rank'],['story','Story']];
const header = () => `<header class="top"><h1 class="logo">kahaniyon</h1><button class="avatar-btn" data-a="profile" aria-label="Profile">${I.user}</button></header>`;
const tabsBar = () => `<div class="tabs" role="tablist">${TABS.map(([k,l]) => `<button class="tab" role="tab" aria-selected="${S.tab===k}" data-a="tab" data-v="${k}">${l}</button>`).join('')}</div>`;
function hero(s){
  const has = S.chats[s.id] && S.chats[s.id].messages.length;
  return cv(s, 'hero', `<span class="chip">${esc(s.genre)}</span>${coverTitle(s)}<div class="spacer"></div><button class="start" data-a="open" data-id="${s.id}">${has ? 'Chat jaari rakho' : 'Chat shuru karo'}</button>`);
}
const railItem = s => `<button class="rail-item" data-a="open" data-id="${s.id}">${cv(s,'','','avatar')}<span>${esc(s.title)}</span></button>`;
const gridCard = s => `<button class="card" data-a="open" data-id="${s.id}">${cv(s,'',coverTitle(s))}<b>${esc(s.title)}</b><small>${esc(s.genre)}</small></button>`;
function listRow(s, rank){
  return `<button class="row-item" data-a="open" data-id="${s.id}">${rank ? `<span class="rank ${rank<=3?'top3':''}">${rank}</span>` : ''}${cv(s)}

}
function continueList(){

  } else if(S.tab === 'new'){

function openingHtml(s){
  const t = (s.opening || '').replace(/\{user\}/g, S.set.name);

  return `<div class="row" data-mid="opening" data-kind="open"><div class="bub a">${s.openImage ? `<img class="pic" src="${s.openImage}" alt="" data-a="zoomOpen">` : ''}${fmt(t)}</div></div>`;

  if(S.view === 'welcome'){

  }

    if(!story(S.chatId)){ S.view = 'home'; return render(); }
    sc.className = 'chat'; nav.classList.add('hide'); sc.innerHTML = chatView();
    const box = $('#msgs'); const c = S.chats[S.chatId];
    box.addEventListener('scroll', updDown, {passive:true});
    box.scrollTop = (c && c.messages.length) ? box.scrollHeight : 0;
    syncAct(); paintTray(); updDown(); return;
  }
  if(S.view === 'profile'){
    sc.className = ''; nav.classList.add('hide'); sc.innerHTML = profileView(); sc.scrollTop = 0; return;
  }
  sc.className = ''; nav.classList.remove('hide');

let heroTimer = null;
function stopHeroAuto(){ if(heroTimer){ clearInterval(heroTimer); heroTimer = null; } }
function startHeroAuto(){
  const rail = document.querySelector('.herorail'); if(!rail || rail.children.length < 2) return;
  let paused = false;
  rail.addEventListener('pointerdown', () => { paused = true; }, {once:true});
  heroTimer = setInterval(() => {
    if(paused || !document.body.contains(rail)){ stopHeroAuto(); return; }
    const card = rail.firstElementChild; if(!card) return;
    const step = card.getBoundingClientRect().width + 14;
    const max = rail.scrollWidth - rail.clientWidth;
    const next = rail.scrollLeft + step >= max - 5 ? 0 : rail.scrollLeft + step;
    rail.scrollTo({left: next, behavior:'smooth'});
  }, 1800);
}
function go(view, extra){
  if(S.view === 'home' || S.view === 'search' || S.view === 'chats') S.scroll[S.view] = $('#screen').scrollTop;
  S.view = view; Object.assign(S, extra || {});

  render();
}

let lastBack = 0;
function rootBack(){
  if(S.ov){ closeOv(); return; }
  if(S.view !== 'home'){ S.view = 'home'; history.pushState({app:1, view:'home'}, ''); render(); return; }
  const now = Date.now();
  if(now - lastBack < 2300){ return; }
  lastBack = now; toast('Bahar jaane ke liye dobara back dabao');
  history.pushState({app:1, view:'home'}, '');
}
window.addEventListener('popstate', e => {
  const st = e.state;
  if(!st || !st.app){ rootBack(); return; }
  const wasOv = S.ov;
  if(S.ov && !st.ov){ hideOv(); S.ov = null; }
  if(!st.ov && (st.view !== S.view || (st.id || null) !== S.chatId)){
    if(S.rec){ try{ S.rec.stop(); }catch(_){} }
    S.view = st.view; S.chatId = st.id || null; S.tray = null;
    if((S.view === 'edit' || S.view === 'appinfo') && !S.draft) S.view = 'home';
    render();
  } else if(wasOv && !st.ov && (S.view === 'profile' || S.view === 'appinfo')){
    render(); /* sheet band hua, par profile/app-settings screen apne aap update nahi hui thi */
  }
  if(S.after){ const f = S.after; S.after = null; f(); }
});
/* Kai website-to-APK / Cordova / Capacitor wrapper hardware back button ko is standard

function parseFbConfig(text){
  let t = (text || '').trim();
  t = t.replace(/^\s*(?:export\s+)?(?:const|let|var)\s+\w+\s*=\s*/, '').replace(/;\s*$/, '');
  t = t.replace(/([{,]\s*)([A-Za-z0-9_$]+)\s*:/g, '$1"$2":').replace(/'/g, '"').replace(/,\s*}/g, '}');
  const cfg = JSON.parse(t);
  if(!cfg.apiKey || !cfg.projectId) throw new Error('bad');
  return cfg;
}
function initFirebase(cfg){
  try{
    if(!window.firebase){
      const why = window.__fbLoadFailed
        ? 'Firebase load nahi ho paya — ye page kisi restrictive tareeke se khula hai (jaise content:// ya WebView), jo bahar ki files load nahi karne deta. Isko https:// se hosted jagah (jaise GitHub Pages, Cloudflare Pages) se kholkar try karo.'
        : 'Firebase abhi load ho raha hai, 2-3 second ruk kar dobara try karo. Agar phir bhi na ho to internet check karo.';
      toast(why); return false;
    }
    if(!FB.app) FB.app = firebase.initializeApp(cfg);
    FB.auth = firebase.auth(); FB.db = firebase.firestore(); FB.ready = true;
    FB.auth.onAuthStateChanged(u => { S.user = u; if(S.ov === 'sheet') showOv('sheet', accountSection() + settingsButtons()); else render(); });
    listenContent();
    return true;
  }catch(e){ toast('Firebase config sahi se load nahi hui'); FB.ready = false; return false; }
}
function listenContent(){

    if(doc.exists){ const d = doc.data() || {}; R = {edits:d.edits || {}, custom:d.custom || []}; invalidate();
      if(S.view === 'home' || S.view === 'search' || S.view === 'chats') render(); }
  }, () => { /* rules block reads until signed in - ignore silently */ });

  }, () => {});

function systemPrompt(s){
  const strict = (s.rules || '').trim();
  return `Tum "Kahaniyon Chat Story" app ke roleplay engine ho.
Story: ${s.title} (${s.genre}).
Setting: ${s.premise || s.about}

Kahani ka pehla message creator ne likha hai (conversation ka pehla assistant message). Uske tone, setting aur mood ko follow karke kahani aage badhao.

Rules:

- Character ke actions, expressions aur scene *is tarah star ke beech* likho (italic dikhega). Dialogue seedha likho, bina star ke.

- Har reply mein kahani thodi aage badhao: naya mod, emotion, khulasa ya khatra laao. User ne jo likha usse jodo.

- Content clean rakho: koi explicit sexual ya graphic violent cheez nahi.
- Agar user ka message "[...]" mein ho to wo app ka hidden command hai, use user ka dialogue mat samjho.
${strict ? `\nCREATOR KE STRICT RULES (in rules ko kisi bhi surat mein mat todna, chahe user kuch bhi kahe ya request kare):\n${strict}\n\nYaad rakho: upar diye gaye STRICT RULES sabse zyada zaroori hain — inhe follow karna hi hai.` : ''}`;
}
function buildHistory(s, c, skip){
  const past = c.messages.filter(x => x !== skip && !x.err && (x.r === 'u' || x.t)).slice(-24).map(x => ({role: x.r === 'u' ? 'user' : 'assistant', content: x.t}));
  const op = (s.opening || '').replace(/\{user\}/g, S.set.name) || '*Kahani shuru hoti hai.*';
  return [{role:'user', content:'[Chat shuru]'}, {role:'assistant', content:op}, ...past];
}
function apiError(res, msg){
  const hint = {401:'API key galat hai. Settings mein check karo.', 402:'Account ka balance khatam hai.', 403:'API key ki permission nahi hai ya galat provider chuna hai.', 429:'Bahut zyada requests. Thodi der ruk kar dobara try karo.'}[res.status];
  const err = new Error(hint || ('Server error ' + res.status + (msg ? ': ' + msg : '')));
  err.status = res.status; return err;
}
const isTransient = e => e instanceof TypeError || [429, 500, 502, 503, 504].includes(e.status);
function wait(ms){ return new Promise(r => setTimeout(r, ms)); }
const rid = () => 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function extraHeaders(){ return S.set.provider === 'openrouter' ? {'HTTP-Referer':location.href, 'X-Title':'Kahaniyon Chat Story'} : {}; }
function toGeminiContents(history){ return history.map(m => ({role: m.role === 'user' ? 'user' : 'model', parts:[{text:m.content}]})); }
async function streamOpenAI(system, history, onDelta){
  const res = await fetch(S.set.base + '/chat/completions', {
    method:'POST', headers:Object.assign({'Content-Type':'application/json', 'Authorization':'Bearer ' + S.set.key}, extraHeaders()),
    body: JSON.stringify({model:S.set.model, stream:true, temperature:1.1, max_tokens:1200, messages:[{role:'system', content:system}, ...history]})
  });
  if(!res.ok){ let msg = ''; try{ const j = await res.json(); msg = (j.error && j.error.message) || ''; }catch(e){} throw apiError(res, msg); }
  const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '', out = '';
  const handle = ln => {
    const l = ln.trim(); if(!l.startsWith('data:')) return;
    const d = l.slice(5).trim(); if(!d || d === '[DONE]') return;
    try{ const j = JSON.parse(d), p = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content; if(p){ out += p; onDelta(out); } }catch(e){}
  };
  for(;;){
    const {done, value} = await rd.read();
    if(done){ buf += dec.decode(); if(buf.trim()) handle(buf); break; }
    buf += dec.decode(value, {stream:true});
    const lines = buf.split('\n'); buf = lines.pop();
    for(const ln of lines) handle(ln);
  }
  return out;
}
async function streamGemini(system, history, onDelta){
  const url = `${S.set.base}/models/${encodeURIComponent(S.set.model)}:streamGenerateContent?alt=sse&key=${encodeURIComponent(S.set.key)}`;
  const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({contents:toGeminiContents(history), systemInstruction:{parts:[{text:system}]}, generationConfig:{temperature:1.1, maxOutputTokens:4096}})});
  if(!res.ok){ let msg = ''; try{ const j = await res.json(); msg = (j.error && j.error.message) || ''; }catch(e){} throw apiError(res, msg); }
  const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '', out = '';
  const handle = ln => {
    const l = ln.trim(); if(!l.startsWith('data:')) return;
    const d = l.slice(5).trim(); if(!d) return;
    try{ const j = JSON.parse(d), cd = j.candidates && j.candidates[0], p = cd && cd.content && cd.content.parts && cd.content.parts.filter(x => !x.thought).map(x => x.text || '').join(''); if(p){ out += p; onDelta(out); } }catch(e){}
  };
  for(;;){
    const {done, value} = await rd.read();
    if(done){ buf += dec.decode(); if(buf.trim()) handle(buf); break; }
    buf += dec.decode(value, {stream:true});
    const lines = buf.split('\n'); buf = lines.pop();
    for(const ln of lines) handle(ln);
  }
  return out;
}
function streamCompletion(system, history, onDelta){ return S.set.kind === 'gemini' ? streamGemini(system, history, onDelta) : streamOpenAI(system, history, onDelta); }
async function oneShotOpenAI(system, messages){
  const res = await fetch(S.set.base + '/chat/completions', {
    method:'POST', headers:Object.assign({'Content-Type':'application/json', 'Authorization':'Bearer ' + S.set.key}, extraHeaders()),
    body: JSON.stringify({model:S.set.model, stream:false, temperature:1.1, max_tokens:200, messages:[{role:'system', content:system}, ...messages]})
  });
  if(!res.ok) throw apiError(res, '');
  const j = await res.json();
  return (j.choices && j.choices[0] && j.choices[0].message.content) || '';
}
async function oneShotGemini(system, messages){
  const url = `${S.set.base}/models/${encodeURIComponent(S.set.model)}:generateContent?key=${encodeURIComponent(S.set.key)}`;
  const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({contents:toGeminiContents(messages), systemInstruction:{parts:[{text:system}]}, generationConfig:{temperature:1.1, maxOutputTokens:1024}})});
  if(!res.ok) throw apiError(res, '');
  const j = await res.json();
  const cd = j.candidates && j.candidates[0];
  return (cd && cd.content && cd.content.parts && cd.content.parts.filter(x => !x.thought).map(x => x.text || '').join('')) || '';
}
function oneShotCompletion(system, messages){ return S.set.kind === 'gemini' ? oneShotGemini(system, messages) : oneShotOpenAI(system, messages); }
async function ai(id, hidden){
  if(S.busy) return;
  const s = story(id), c = S.chats[id];
  if(!S.set.key){ aiNotReady(); return; }
  if(hidden) c.messages.push({r:'u', t:hidden, h:1, id:rid()});
  const m = {r:'a', t:'', id:rid()}; c.messages.push(m);
  S.busy = true; c.updated = Date.now(); S.tray = null; paintTray(); paintMsgs(id, true);
  const history = buildHistory(s, c, m);
  const MAX_TRY = 5, BACKOFF = [1500, 3000, 5000, 8000];
  for(let attempt = 0; attempt < MAX_TRY; attempt++){
    try{
      const full = await streamCompletion(systemPrompt(s), history, txt => { m.t = txt; paintMsgs(id); });
      if(!full.trim()) throw new Error('AI ne kuch nahi likha. Dobara koshish karo.');
      m.t = full; m.err = null; break;
    }catch(e){
      if(isTransient(e) && attempt < MAX_TRY - 1){
        m.t = ''; m.retrying = true; paintMsgs(id);
        await wait(BACKOFF[attempt] || 8000);
        continue;
      }
      m.t = ''; m.retrying = false;
      m.err = (e instanceof TypeError) ? 'AI se connect nahi ho paya. Internet check karo. Agar browser seedha call block kar raha hai to Settings mein apne backend proxy ka URL daalo.' : e.message;
      break;
    }
  }
  m.retrying = false;
  S.busy = false; c.updated = Date.now(); saveChats(); paintMsgs(id);
}
function truncateAfter(mid){
  const c = S.chats[S.chatId]; if(!c) return -1;
  const idx = c.messages.findIndex(m => m.id === mid);
  if(idx === -1) return -1;
  c.messages = c.messages.slice(0, idx + 1);
  return idx;
}
function contFrom(mid){
  if(S.busy) return;
  if(!S.set.key){ aiNotReady(); return; }
  const c = S.chats[S.chatId]; c.messages = c.messages.filter(m => !m.err);
  if(truncateAfter(mid) === -1) return;
  saveChats(); ai(S.chatId, NEXT_MSG);
}
function regenFrom(mid){
  if(S.busy) return;
  if(!S.set.key){ aiNotReady(); return; }
  const c = S.chats[S.chatId]; if(!c) return;
  const idx = c.messages.findIndex(m => m.id === mid);
  if(idx === -1) return;
  c.messages = c.messages.filter(m => !m.err).slice(0, idx);
  saveChats(); ai(S.chatId);
}
function sendUser(text){
  text = (text || '').trim(); if(!text || S.busy) return;
  if(!S.set.key){ aiNotReady(); return; }
  if(!S.chats[S.chatId]) S.chats[S.chatId] = {messages:[], updated:Date.now()};
  const c = S.chats[S.chatId];
  c.messages = c.messages.filter(m => !m.err);
  c.messages.push({r:'u', t:text, id:rid()}); saveChats(); bumpPopularity(S.chatId); ai(S.chatId);
}
async function getHints(){
  const id = S.chatId, s = story(id); if(S.busy) return;
  if(!S.set.key){ aiNotReady(); return; }
  if(S.tray && !S.tray.loading){ S.tray = null; paintTray(); return; }
  const c = S.chats[id] || {messages:[]};
  S.tray = {loading:true, items:[]}; paintTray();
  try{
    const text = await oneShotCompletion(systemPrompt(s), [...buildHistory(s, c, null),
      {role:'user', content:'[HINT] Ab user ke liye 3 alag chhote reply suggest karo (har ek 12 shabdon se kam, user ki taraf se, dialogue ya *action*). Har suggestion nayi line par, bina number ya prefix ke. Sirf 3 lines.'}]);
    const items = text.split('\n').map(x => x.replace(/^\s*(?:[-•\d.)]+\s*)/, '').replace(/^["“]|["”]$/g, '').trim()).filter(Boolean).slice(0, 3);
    if(S.chatId === id && S.tray) S.tray = {loading:false, items};
  }catch(e){
    S.tray = null; toast(e instanceof TypeError ? 'Suggestions nahi aa paye. Internet check karo.' : e.message);
  }
  paintTray();
}

/* ---------- voice (mic) ---------- */
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Is browser mein voice typing nahi hai'); return; }
  if(S.rec){ try{ S.rec.stop(); }catch(e){} return; }
  const r = new SR(), inp = $('#inp'), base = inp.value;
  r.lang = 'hi-IN'; r.interimResults = true; r.continuous = false;
  r.onresult = e => { let t = ''; for(const x of e.results) t += x[0].transcript; inp.value = (base + ' ' + t).trim(); autosize(); syncAct(); };
  r.onend = () => { S.rec = null; syncAct(); };
  r.onerror = ev => { toast(ev.error === 'not-allowed' ? 'Mic ki permission do' : 'Awaaz sun nahi paya'); };
  S.rec = r; try{ r.start(); }catch(e){ S.rec = null; } syncAct();
}

/* ---------- portrait lock ---------- */
function isLandscape(){
  try{ if(screen.orientation && screen.orientation.type) return screen.orientation.type.startsWith('landscape'); }catch(e){}
  return Math.abs(window.orientation || 0) === 90;
}
function checkOrient(){ $('#rot').classList.toggle('on', matchMedia('(pointer:coarse)').matches && isLandscape()); }
function tryLock(){ try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(() => {}); }catch(e){} }
async function goFull(){
  try{ await document.documentElement.requestFullscreen(); await screen.orientation.lock('portrait'); toast('Full screen mein portrait lock ho gaya'); }
  catch(e){ toast('Is browser mein lock nahi ho paya. APK ya installed app mein pakka lock hota hai.'); }
}
if(screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', checkOrient);
addEventListener('orientationchange', checkOrient);
document.addEventListener('click', function once(){ tryLock(); document.removeEventListener('click', once); }, {once:false});

  if(!S.chats[id]) S.chats[id] = {messages:[], updated:Date.now()};
  go('chat', {chatId:id, tray:null});
}

  zoom: el => { const s = story(S.chatId); openOv('lb', `<img src="${s.images[+el.dataset.i]}" alt="Story photo">`); },
  zoomOpen: () => { const s = story(S.chatId); openOv('lb', `<img src="${s.openImage}" alt="Photo">`); },
  down: () => { const m = $('#msgs'); m.scrollTo({top:m.scrollHeight, behavior:'smooth'}); },
  act: () => {
    if(S.rec){ try{ S.rec.stop(); }catch(e){} return; }
    const i = $('#inp'); if(i.value.trim()){ const t = i.value; i.value = ''; autosize(); S.tray = null; paintTray(); syncAct(); sendUser(t); } else toast('Awaaz se likhna jald aa raha hai');
  },
  hint: getHints,
  pickHint: el => { const i = $('#inp'); i.value = el.dataset.t; S.tray = null; paintTray(); autosize(); syncAct(); i.focus(); },
  contFrom: el => contFrom(el.dataset.mid), regenFrom: el => regenFrom(el.dataset.mid),
  next: () => { if(S.busy) return; if(!S.set.key){ aiNotReady(); return; } const c = S.chats[S.chatId]; c.messages = c.messages.filter(m => !m.err); ai(S.chatId, NEXT_MSG); },
  retry: () => { const c = S.chats[S.chatId]; c.messages = c.messages.filter(m => !m.err); ai(S.chatId); },
  menu: openMenu,
  replay: () => ACT.restart(),
  guide: () => closeOv(() => openOv('sheet', `<h2>Play Guide</h2><p>${esc(story(S.chatId).about || story(S.chatId).premise || story(S.chatId).sub || '')}</p>
    <div class="notice on">Neeche diye options par tap karo ya apna message likho. "Kahani aage badhao" naya mod layega.</div>
    <button class="btn ghost" data-a="closeOv">Theek hai</button>`)),

    <div class="field"><label for="repR">Reason</label><select id="repR"><option>Inappropriate content</option><option>Spam</option><option>Bug ya error</option><option>Kuch aur</option></select></div>
    <div class="field"><label for="repN">Details (optional)</label><textarea id="repN" placeholder="Thodi detail likho"></textarea></div>
    <button class="btn" data-a="sendReport">Report bhejo</button><button class="btn ghost" data-a="closeOv">Cancel</button>`)),
  sendReport: () => {
    const r = $('#repR').value, n = $('#repN').value.trim();
    if(FB.ready) FB.db.collection('reports').add({story:S.chatId, reason:r, note:n, at:Date.now(), by:(S.user && S.user.uid) || 'guest'}).catch(() => {});
    closeOv(() => toast('Report bhej diya, dhanyawad'));
  },

    if(navigator.share) navigator.share(data).catch(() => {});

    if(kind === 'open') text = (story(S.chatId).opening || '').replace(/\{user\}/g, S.set.name);

document.addEventListener('click', e => {

  const f = ACT[el.dataset.a]; if(f) f(el);
});
let holdTimer = null, holdEl = null, holdX = 0, holdY = 0;
function holdCancel(){ if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; } if(holdEl){ holdEl.classList.remove('pressed'); holdEl = null; } }
document.getElementById('app').addEventListener('pointerdown', e => {
  const row = e.target.closest('#msgs [data-mid]'); if(!row || S.busy) return;
  holdEl = row.querySelector('.bub') || row; holdX = e.clientX; holdY = e.clientY;
  holdTimer = setTimeout(() => { if(holdEl){ holdEl.classList.add('pressed'); if(navigator.vibrate) navigator.vibrate(12); openMsgMenu(row); } holdTimer = null; }, 480);
});
document.getElementById('app').addEventListener('pointermove', e => { if(holdTimer && (Math.abs(e.clientX - holdX) > 10 || Math.abs(e.clientY - holdY) > 10)) holdCancel(); });
document.getElementById('app').addEventListener('pointerup', holdCancel);
document.getElementById('app').addEventListener('pointerleave', holdCancel);
document.getElementById('app').addEventListener('contextmenu', e => { if(e.target.closest('#msgs [data-mid]')) e.preventDefault(); });

  try{ const r = await fetch('content.json', {cache:'no-cache'}); if(r.ok){ const j = await r.json(); R = {edits:j.edits || {}, custom:j.custom || []}; } }catch(e){}

}

}

render(); checkOrient(); tryLock();
boot();
