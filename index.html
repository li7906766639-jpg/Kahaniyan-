<!DOCTYPE html>
<html lang="hi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d0d0f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kahaniyon Chat Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js" crossorigin="anonymous" onerror="window.__fbLoadFailed=true"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js" crossorigin="anonymous" onerror="window.__fbLoadFailed=true"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js" crossorigin="anonymous" onerror="window.__fbLoadFailed=true"></script>
<style>
:root,[data-theme="dark"]{
  --bg:#0d0d0f; --surface:#19191c; --surface2:#23262d; --line:#2a2a2f; --text:#f5f2ee; --muted:#8d8b89;
  --bar:#111114; --ai:#242830; --ai-text:#f1eeea; --em:#a9aebb; --gold:#e7c26b; --red:#e5322d; --red-dim:#7a1f1d; --nar:rgba(255,255,255,.05);
  --doodle:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170' viewBox='0 0 170 170' fill='none' stroke='%23ffffff' stroke-opacity='.06' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M30 40c-8-10 4-20 10-10 6-10 18 0 10 10l-10 12z'/><circle cx='118' cy='34' r='9'/><path d='M126 104l4 9 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z'/><path d='M28 118h20v15H28zM33 118l2-5h8l2 5'/><circle cx='38' cy='126' r='3.5'/><path d='M84 148c0-9 14-9 14 0M100 70h16M108 62v16'/></svg>");
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#f6f3ee; --surface:#ffffff; --surface2:#ebe8e2; --line:#dcd7cf; --text:#1b1a19; --muted:#6c6862;
  --bar:#ffffff; --ai:#e6e9ef; --ai-text:#1b1a19; --em:#5d6270; --gold:#8a5d00; --nar:rgba(0,0,0,.04);
  --doodle:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170' viewBox='0 0 170 170' fill='none' stroke='%23000000' stroke-opacity='.07' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M30 40c-8-10 4-20 10-10 6-10 18 0 10 10l-10 12z'/><circle cx='118' cy='34' r='9'/><path d='M126 104l4 9 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z'/><path d='M28 118h20v15H28zM33 118l2-5h8l2 5'/><circle cx='38' cy='126' r='3.5'/><path d='M84 148c0-9 14-9 14 0M100 70h16M108 62v16'/></svg>");
  color-scheme:light;
}
:root{
  --display:"Yatra One",Georgia,"Times New Roman",serif;
  --body:"Hind",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;overscroll-behavior-y:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:relative;max-width:480px;height:100%;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-top:var(--safe-t)}
#screen.chat{overflow:hidden;display:flex;flex-direction:column}

.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px}
.logo{margin:0;font-family:var(--display);font-weight:400;font-size:34px;letter-spacing:.5px;line-height:1;user-select:none;-webkit-user-select:none}
.avatar-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold)}
.tabs{display:flex;gap:26px;padding:10px 20px 0;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 0 12px;font-size:18px;font-weight:600;color:var(--muted);white-space:nowrap;position:relative}
.tab[aria-selected="true"]{color:var(--text)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--red)}
.pad{padding:16px 20px 24px}
.h2{font-size:24px;font-weight:700;margin:26px 0 14px}

.cover{position:relative;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 70% at 75% 0%,color-mix(in srgb,var(--glow) 38%,transparent),transparent 62%),linear-gradient(165deg,var(--c1),var(--c2))}
.cover.has-img{background-size:cover;background-position:center;background-color:#000}
.cover-sym{position:absolute;width:78%;left:11%;top:22%;opacity:.22;z-index:-1}
.cover-title{font-family:var(--display);color:#e7c26b;line-height:1.02}
.cover-sub{color:rgba(255,255,255,.8)}


.herorail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 2px;scrollbar-width:none}
.herorail::-webkit-scrollbar{display:none}
.herorail .hero{flex:0 0 80%;scroll-snap-align:start}
.hero{border-radius:22px;aspect-ratio:4/5;display:flex;flex-direction:column;padding:22px 20px 18px;box-shadow:0 0 0 1px rgba(255,255,255,.05);color:#fff}
.hero{cursor:pointer}
.hero .chip{align-self:flex-start;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.18);margin-bottom:10px;color:#fff}
.hero .cover-title{font-size:clamp(38px,12.5vw,58px)}
.hero .cover-sub{font-size:17px;margin-top:10px;max-width:16em}
.hero .spacer{flex:1}
.start{width:100%;padding:15px;border-radius:16px;background:rgba(40,40,44,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:19px;font-weight:700;letter-spacing:.3px;border:1px solid rgba(255,255,255,.12);color:#fff}
.start:active{background:var(--red)}

.rail{display:flex;gap:16px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail-item{flex:0 0 84px;text-align:center}
.rail-item .cover{width:78px;height:78px;border-radius:50%;margin:0 auto 8px;border:2px solid var(--red-dim)}
.rail-item .cover-sym{width:70%;left:15%;top:15%;opacity:.5}
.rail-item span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;font-weight:600;line-height:1.25}
.empty{color:var(--muted);font-size:15px;padding:6px 0}
.top .right{display:flex;align-items:center;gap:10px}
.coinchip{display:flex;align-items:center;gap:7px;height:38px;padding:0 13px 0 6px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:16px}
.coinchip .coin{width:26px;height:26px;font-size:14px;border-width:2px}
.herorail .hero{flex:0 0 100%;aspect-ratio:7/8}
.hero .hero-t{font-size:17px;font-weight:700;margin-bottom:10px;text-shadow:0 1px 8px rgba(0,0,0,.75)}
.sechead{display:flex;align-items:center;justify-content:space-between;margin:28px 0 14px}
.sechead h2{margin:0;font-size:22px;font-weight:700}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}
.pcard{text-align:left;display:block;min-width:0}
.pcard .cover{aspect-ratio:3/4;border-radius:16px;padding:12px;display:flex;flex-direction:column}
.pcard .cover-title{font-size:22px}
.pcard .cover-sub{font-size:12px;margin-top:auto}
.pcard b{display:block;margin-top:9px;font-size:16px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard small{color:var(--muted);font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{position:absolute;right:8px;bottom:8px;display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:8px;background:rgba(20,20,22,.8);color:#fff;font-size:12.5px;font-weight:700}
.rank10{position:absolute;left:8px;bottom:0;font-size:70px;font-weight:900;line-height:1;color:var(--red);-webkit-text-stroke:2px rgba(255,255,255,.92);text-shadow:0 3px 10px rgba(0,0,0,.5)}
.viewall{width:100%;height:50px;margin-top:20px;border-radius:99px;background:#2a1414;border:1px solid var(--red-dim);color:#f5d9d6;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:6px}
[data-theme="light"] .viewall{background:#fbe9e7;color:#7a1f1d}
.gtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 10px}
.gtile{text-align:center;min-width:0}
.gtile .cover{aspect-ratio:1/1.1;border-radius:14px}
.gtile span{display:block;margin-top:6px;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}


.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{text-align:left}
.card .cover{aspect-ratio:3/4;border-radius:16px;padding:14px 12px;display:flex;flex-direction:column}
.card .cover-title{font-size:24px}
.card .cover-sub{font-size:12.5px;margin-top:auto}
.card b{display:block;margin-top:8px;font-size:15px}
.card small{color:var(--muted);font-size:13px}
.row-item{position:relative;display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row-item .when{flex:0 0 auto;align-self:flex-start;color:var(--muted);font-size:12.5px;white-space:nowrap;margin-left:6px}
.row-item .cover{flex:0 0 70px;height:92px;border-radius:12px}
.row-item .cover-sym{width:80%;left:10%;top:20%}
.row-item .meta{flex:1;min-width:0}
.row-item .t{font-size:18px;font-weight:700}
.row-item .g{font-size:13px;color:var(--gold)}
.row-item .s{font-size:14px;color:var(--muted);margin-top:2px}
.rank{flex:0 0 26px;font-family:var(--display);font-size:26px;color:var(--muted);text-align:center}
.rank.top3{color:var(--gold)}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--red);margin-left:6px;vertical-align:middle;color:#fff}
.pill-btn{padding:8px 14px;border-radius:99px;background:var(--surface2);font-weight:600;font-size:14px;white-space:nowrap}

.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:8px}
.search input{flex:1;height:48px;background:none;border:0;color:var(--text);font:inherit;font-size:17px;outline-offset:6px}
.search svg{color:var(--muted);flex:0 0 auto}

#nav{display:flex;border-top:1px solid var(--line);background:var(--bar);padding-bottom:var(--safe-b)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;color:var(--muted);font-size:14px;font-weight:600}
#nav button[aria-current="page"]{color:var(--text)}
#nav.hide{display:none}
#nav button{position:relative}
.nbadge{position:absolute;top:4px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#e5232d;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.nbadge[hidden]{display:none}
.row-item.chat-row{padding:12px 0;border-bottom:0;gap:14px}
.row-item.chat-row .cover{flex:0 0 68px;width:68px;height:68px;border-radius:50%}
.row-item.chat-row .cover-sym{width:70%;left:15%;top:15%}
.row-item.chat-row .meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.row-item.chat-row .t{display:block;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item.chat-row .p{display:block;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item.chat-row.unr .p{color:var(--text)}
.row-item.chat-row .when{margin-top:4px}
.row-item.chat-row .ubadge{bottom:16px}
.row-item .ubadge{position:absolute;right:2px;bottom:14px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:#e5232d;color:#fff;font-size:14px;font-weight:700;display:grid;place-items:center}

.cbar{margin:10px 20px 0;padding:12px 14px;border-radius:14px;background:#2a1f10;border:1px solid #5a4218;color:#f3e2bd}
.cbar b{display:block;margin-bottom:8px}
.cbar .acts{display:flex;gap:8px;flex-wrap:wrap}
.cbar .pill-btn{background:#3b2d16;color:#f3e2bd}

/* chat */
.chat-head{display:flex;align-items:center;gap:8px;padding:10px 10px;border-bottom:1px solid var(--line);background:var(--bar)}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:0 0 auto}
.icon-btn:active{background:var(--surface2)}
.hav{position:relative;flex:0 0 46px;height:46px}
.hav .cover{width:46px;height:46px;border-radius:50%}
.hav .cover-sym{width:70%;left:15%;top:15%;opacity:.5}
.hav .dot{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:#22c55e;border:2px solid var(--bar)}
.chat-head .who{flex:1;min-width:0;padding-left:2px}
.chat-head .who b{display:block;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .who small{color:var(--muted);font-size:14px}
.chatbody{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
#msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 10px;display:flex;flex-direction:column;gap:12px;background-color:var(--bg);background-image:var(--doodle)}
.pw{text-align:center;color:var(--muted);font-size:16px;padding:6px 0 0}
.about{border:1px solid var(--line);border-radius:22px;background:var(--surface);padding:14px}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.strip::-webkit-scrollbar{display:none}
.shot{flex:0 0 46%;aspect-ratio:1/1.12;border-radius:16px;background-size:cover;background-position:center;background-color:var(--surface2)}
.shot.poster{padding:14px 12px;display:flex;flex-direction:column}
.shot.poster .cover-title{font-size:26px}
.shot.poster .cover-sub{font-size:12.5px;margin-top:auto}
.about h3{margin:16px 6px 4px;font-size:22px;font-weight:600}
.about p{margin:0 6px;font-size:18px;line-height:1.5;white-space:pre-wrap}
.price{display:flex;align-items:center;gap:10px;width:max-content;margin:16px auto 4px;background:var(--surface2);border-radius:99px;padding:8px 22px 8px 12px;font-size:18px;color:var(--muted)}
.payqr{display:grid;place-items:center;background:#fff;border-radius:16px;padding:10px;margin:12px auto;width:fit-content}
.payqr svg{display:block;width:230px;height:230px;max-width:100%}
.hint{color:var(--muted);font-size:14.5px;margin:10px 0}
.prow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.prow small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px;word-break:break-all}
.pst{font-weight:700;font-size:13.5px;white-space:nowrap}
.pst-p{color:#e9b02a}.pst-ok{color:#35c46a}.pst-no{color:#e5534d}
.pbtns{display:flex;gap:8px;margin-top:8px}
.coinnote{color:var(--muted);font-size:14.5px;margin:12px 2px 0}
.coin.hexk,.coincard .coin.hexk.big{border:0;border-radius:0;background:linear-gradient(145deg,#ffd75e,#f5a300);color:#6a3d00;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);font-weight:800;text-transform:lowercase;display:grid;place-items:center}
.coin.hexk.lg{width:58px;height:58px;font-size:32px;flex:0 0 auto}
.coinchip .coin.hexk{width:28px;height:28px;font-size:16px}
.ctag{display:block;width:fit-content;background:#2a2410;color:#e9c84a;border-radius:8px;padding:6px 12px;font-size:15px;margin-bottom:12px}
.cpack,.coffer{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
.crow{display:flex;align-items:center;gap:14px}
.cinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cinfo b{font-size:30px;font-weight:700;line-height:1.1}
.cinfo b small{font-size:18px;color:var(--muted);font-weight:500}
.cinfo span{color:var(--muted);font-size:15px}
.cprice{background:#fff;color:#111;font-weight:800;font-size:20px;padding:10px 18px;border-radius:12px;white-space:nowrap}
[data-theme="light"] .cprice{background:#111;color:#fff}
.cbanner{display:block;margin:-14px -14px 14px;background:#0a6b3d;color:#fff;text-align:center;font-weight:700;padding:8px;border-radius:18px 18px 0 0;font-size:17px}
.coin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#f5b300;color:#5a3a00;font-weight:700;font-size:18px;border:3px solid #ffcf3d}
.about .edit-row{margin:12px 6px 0}
.row{display:flex;max-width:100%}
.row.u{justify-content:flex-end}
.msgActs{display:flex;gap:4px;margin:-4px 0 2px 4px}
.msgActs button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.msgActs button.on{color:var(--red)}
.msgActs button:active{background:var(--surface2);color:var(--text)}
.msgActs button:disabled{opacity:.4}
.bub{max-width:88%;padding:14px 16px;border-radius:20px;font-size:var(--chat-fs,17px);line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.a{background:var(--ai);color:var(--ai-text);border-bottom-left-radius:8px}
.bub.a em{color:var(--em)}
.bub.u em{opacity:.7}
.bub.u{background:var(--user-bubble,var(--red));color:var(--user-text,#fff);border-bottom-right-radius:8px;max-width:82%}
.bub .pic{display:block;width:100%;border-radius:14px;margin-bottom:10px;cursor:zoom-in}
.typing{display:flex;gap:5px;padding:18px 18px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.err{background:#2a1414;color:#f5e6e4;border:1px solid var(--red-dim);border-radius:14px;padding:12px 14px;font-size:15px}
.err .acts{display:flex;gap:8px;margin-top:10px}
.err .pill-btn{background:#3a1e1e;color:#fff}
.down{position:absolute;right:14px;bottom:10px;width:46px;height:46px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.down[hidden]{display:none}
.composer{padding:8px 12px calc(10px + var(--safe-b));background:var(--bg)}
.tray{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;align-items:center}
.tray:empty{display:none}
.tray::-webkit-scrollbar{display:none}
.chip-btn{flex:0 0 auto;padding:8px 14px;border-radius:99px;border:1px solid var(--line);font-size:15px;font-weight:500;background:var(--surface);max-width:78vw;text-align:left}
.chip-btn.go{background:var(--red);border-color:var(--red);font-weight:700;color:#fff}
.chip-btn em{color:var(--em)}
.tray .muted{color:var(--muted);font-size:14px;padding:6px 4px}
.inputrow{display:flex;gap:10px;align-items:flex-end}
.pillfield{flex:1;min-width:0;display:flex;align-items:flex-end;background:var(--surface2);border-radius:27px;padding:0 4px 0 20px}
.pillfield:focus-within{outline:2px solid var(--gold)}
.pillfield textarea{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;font-size:17px;padding:14px 0;resize:none;max-height:none;outline:0;line-height:1.3}
.bulb{flex:0 0 46px;height:54px;display:grid;place-items:center;color:var(--text)}
.round{flex:0 0 54px;height:54px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--text)}
.round.send{background:var(--red);color:#fff}
.round.rec{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,50,45,.5)}50%{box-shadow:0 0 0 10px rgba(229,50,45,0)}}

/* overlays */
#sheet{position:absolute;inset:0;z-index:20;display:none;align-items:flex-end;background:rgba(0,0,0,.6)}
#menu{position:absolute;z-index:26;display:none;min-width:236px;max-width:80vw;background:#1c1c20;border-radius:18px;box-shadow:0 14px 34px rgba(0,0,0,.5);border:1px solid var(--line);overflow:hidden}
[data-theme="light"] #menu{background:#ffffff}
#menu.open{display:block}
.mrow{display:flex;align-items:center;gap:13px;padding:13px 16px;width:100%;text-align:left;color:var(--text);font-size:16.5px}
.mrow:active{background:var(--surface2)}
.mrow.danger{color:#ff5850}
.mrow .ic{flex:0 0 22px;display:grid;place-items:center;color:inherit}
.mrow .grow{flex:1;min-width:0}
.mrow .grow small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.mrow .grow b{font-weight:700}
.mdiv{height:1px;background:var(--line)}
.coin2{width:24px;height:24px;border-radius:50%;background:#f5b300;color:#5a3a00;font-weight:700;font-size:13px;display:grid;place-items:center;border:2px solid #ffcf3d}
.bub,.pw~.about .strip,.chat-head .who{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.bub.pressed{filter:brightness(.82)}
.prof-row{display:flex;align-items:center;gap:16px;padding:10px 0 8px}
.prof-av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:26px;font-weight:700;flex:0 0 auto}
.prof-name{font-size:21px}
.prof-sub{color:var(--muted);font-size:14.5px;margin-top:2px}
.coincard{display:flex;align-items:center;gap:14px;background:linear-gradient(100deg,#2c2308,#1a1610);border:1px solid #4a3a12;border-radius:18px;padding:16px 18px;margin-top:18px}
[data-theme="light"] .coincard{background:linear-gradient(100deg,#fff3d6,#fdebc0);border-color:#f0d99a}
.coincard .coin.big{width:46px;height:46px;font-size:20px;border-radius:50%;background:#f5b300;color:#5a3a00;font-weight:700;display:grid;place-items:center;border:3px solid #ffcf3d;flex:0 0 auto}
.coincard small{display:block;color:var(--muted);font-size:13.5px}
.coincard b{font-size:26px}
.plist{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:4px}
.prow{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;text-align:left;font-size:16.5px;border-bottom:1px solid var(--line);color:var(--text)}
.prow:last-child{border-bottom:0}
.prow:active{background:var(--surface2)}
.prow .grow{flex:1}
.prow.danger{color:#ff5850;margin-top:16px;border:1px solid var(--red-dim);border-radius:14px}
.madewith{text-align:center;color:var(--muted);font-size:15px;margin-top:26px}
.verline{text-align:center;color:#5f5c58;font-size:12.5px;line-height:1.6;margin:4px 0 10px}
.faqlist details{border-bottom:1px solid var(--line);padding:12px 2px}
.faqlist summary{font-weight:600;font-size:16px;cursor:pointer;list-style:none}
.faqlist summary::-webkit-details-marker{display:none}
.faqlist p{color:var(--muted);font-size:15px;margin:8px 0 0}
.linklist a{display:block;color:var(--text);text-decoration:none;background:var(--surface2);border-radius:12px;padding:13px 16px;margin-bottom:10px;font-weight:600}
#sheet.open{display:flex}
.sheet-body{width:100%;max-height:92%;overflow-y:auto;background:var(--bar);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + var(--safe-b));border-top:1px solid var(--line)}
.sheet-body h2{margin:0 0 4px;font-size:22px}
.sheet-body p{margin:0 0 14px;color:var(--muted);font-size:14.5px}
#lb{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.94)}
#splash{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);opacity:1;transition:opacity .4s}
#splash.show{display:flex}
#splash.fade{opacity:0}
#splashImg{width:132px;height:132px;border-radius:30px;object-fit:cover;box-shadow:0 14px 34px rgba(0,0,0,.45);transition:.3s}
#splashImg.wide{width:86%;height:70%;border-radius:20px}
#splashName{font-family:var(--display);font-size:30px;color:var(--text);text-align:center;letter-spacing:.5px;padding:0 20px;transition:opacity .3s}
#splashName:empty{display:none}
#splash.photo{display:block}
#splash.photo #splashImg,#splash.photo #splashName{display:none}
#splashPhoto{position:absolute;inset:0;background-size:cover;background-position:center bottom;opacity:0;transition:opacity .45s}
#splashPhoto.on{opacity:1}
#splashShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(70,34,38,.82) 0%,rgba(70,34,38,.42) 36%,rgba(0,0,0,0) 62%,rgba(0,0,0,.32) 100%);display:none}
#splash.photo #splashShade{display:block}
#splashLogo{position:absolute;left:0;right:0;top:26%;text-align:center;font-family:var(--display);font-size:56px;line-height:1.1;color:#f3f3f5;letter-spacing:.5px;text-shadow:0 2px 16px rgba(0,0,0,.45);display:none}
#splash.photo #splashLogo{display:block}
#lb.open{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:16px;height:46px}
.field textarea{height:auto;min-height:92px;padding:10px 14px;resize:vertical;line-height:1.4}
.field small{display:block;color:var(--muted);font-size:13px;margin-top:5px}
.pwrow{display:flex;align-items:center;gap:8px}
.pwrow input{flex:1}
.eyeBtn{flex:0 0 42px;height:46px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px}
.eyeBtn.on{color:var(--text)}
.gpick-row{display:flex;gap:8px;flex-wrap:wrap}
.wage{display:flex;gap:10px;align-items:flex-start;margin:16px 0 0;text-align:left;font-size:14.5px;line-height:1.5;color:var(--text);cursor:pointer}
.wage input{width:22px;height:22px;min-width:22px;margin:1px 0 0;padding:0;accent-color:var(--red);flex:none}
.gpick{padding:10px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14.5px;font-weight:600;color:var(--text)}
.gpick.on{background:var(--red);border-color:var(--red);color:#fff}
.notice{background:#2a1f10;color:#f3e2bd;border:1px solid #5a4218;border-radius:12px;padding:10px 12px;font-size:14.5px;margin-bottom:14px;display:none}
.notice.on{display:block}
.btn{width:100%;height:48px;border-radius:14px;font-weight:700;font-size:17px;background:var(--red);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--text);margin-top:10px}
.btn.danger{background:none;color:#ff7a75;border:1px solid var(--red-dim);margin-top:10px}
.avrow{display:flex;align-items:center;gap:10px}
.avprev{width:64px;height:64px;border-radius:50%;background:var(--surface2) center/cover no-repeat;border:1px solid var(--line)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.urlrow{display:flex;gap:8px;margin-top:10px}
.urlrow input{flex:1;height:42px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:14.5px}
.urlrow .pill-btn{flex:0 0 auto}
.thumb{position:relative;width:84px;height:96px;border-radius:12px;background:var(--surface2) center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;font-size:30px;color:var(--muted)}
.thumb button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:16px;line-height:1}
.stickybar{position:sticky;bottom:0;padding:12px 20px calc(12px + var(--safe-b));background:var(--bar);border-top:1px solid var(--line)}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);z-index:50;background:#f5f2ee;color:#111;padding:10px 16px;border-radius:99px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;max-width:88%;text-align:center}
#miniSpin{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
.spinr{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin1 .8s linear infinite}
@keyframes spin1{to{transform:rotate(360deg)}}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#rot{position:fixed;inset:0;z-index:100;background:#0d0d0f;color:#f5f2ee;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#rot.on{display:flex}
@media (prefers-reduced-motion:reduce){.typing i,.round.rec{animation:none}}
/* ===== v2 look: home, chats, profile ===== */
#app[data-v="home"],#app[data-v="chats"]{--bg:#0d0b12;--surface:#1a1522;--surface2:#241c30;--line:#2a2238;--text:#f3eef7;--muted:#8d82a0;--bar:#0d0b12}
#app[data-v="home"] #screen,#app[data-v="chats"] #screen{background:#0d0b12}
#app[data-v="home"] .top,#app[data-v="chats"] .top{background:transparent;border:0;padding:18px 20px 8px}
.top .logo{font-size:26px;font-weight:500;letter-spacing:.5px}
.ldot{color:#ff4d8d}
.top .right{display:flex;align-items:center;gap:8px}
.iconcirc{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:#cfc4dc;flex:none}
#app[data-v="home"] .tabs{display:flex;gap:8px;padding:8px 20px 14px;border-bottom:0;overflow-x:auto;scrollbar-width:none}
#app[data-v="home"] .tab{flex:none;background:var(--surface);color:#cfc4dc;border-radius:99px;padding:7px 15px;font-size:14px;font-weight:600;height:auto;border:0}
#app[data-v="home"] .tab[aria-selected="true"]{background:#ff4d8d;color:#1a0b12}
#app[data-v="home"] .tab::after{display:none}
.herorail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.hslide{flex:0 0 100%;scroll-snap-align:start;position:relative;padding-top:26px}
.hslide::before{content:"";position:absolute;top:0;left:28px;right:28px;height:300px;border-radius:26px;background:#24102a}
.hslide::after{content:"";position:absolute;top:12px;left:14px;right:14px;height:300px;border-radius:26px;background:#3b1634}
.hslide .hero{position:relative;z-index:1;flex:none;width:100%;aspect-ratio:auto;height:330px;border-radius:26px;padding:16px;display:flex;flex-direction:column;overflow:hidden}
.hslide .hero .chip{align-self:flex-start;background:#0d0b12;color:#ffc2d9;border-radius:99px;padding:4px 11px;font-size:12px}
.hero-t{font-size:26px;font-weight:700;line-height:1.1;color:#fff;margin-bottom:4px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.hero-s{font-size:14px;color:#ffd9e6;margin-bottom:12px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.hrow{display:flex;align-items:center;gap:12px}
.hslide .start{flex:1;background:#f5b300;color:#3a2400;border-radius:99px;padding:12px;font-size:15px;font-weight:700;text-align:center;width:auto}
.hcnt{font-size:13px;color:#ffd9e6;white-space:nowrap}
.hdots{display:flex;justify-content:center;gap:5px;margin:2px 0 6px}
.hdots .hd{width:5px;height:5px;border-radius:50%;background:#3a2f48;transition:.2s}
.hdots .hd.on{width:18px;border-radius:3px;background:#ff4d8d}
.lnk{font-size:13px;color:#ff4d8d;font-weight:600}
.prail{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.prail .pcard{flex:0 0 124px}
.prail .pcard .cover{aspect-ratio:124/170}
.gtiles2{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gtile2{text-align:center;min-width:0}
.gtile2 .gt{height:62px;border-radius:16px;display:grid;place-items:center}
.gtile2 span{display:block;font-size:13px;font-weight:600;margin-top:6px}
.t10{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:12px}
.t10n{font-size:46px;font-weight:700;line-height:1;width:34px;text-align:center;color:#0d0b12;-webkit-text-stroke:1.5px #ff4d8d}
.t10p .cover{width:50px;height:64px;border-radius:12px}
.t10m{flex:1;min-width:0}
.t10t{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t10g{display:block;font-size:13px;color:var(--muted)}
#app[data-v="home"] #nav{position:absolute;left:14px;right:14px;bottom:calc(12px + var(--safe-b));padding:7px 8px;background:#1a1522;border:1px solid #2e2540;border-radius:99px;justify-content:space-around;z-index:20}
#app[data-v="home"] #nav button{flex:0 0 auto;flex-direction:row;gap:7px;padding:9px 16px;border-radius:99px;font-size:0;color:#cfc4dc}
#app[data-v="home"] #nav button[aria-current="page"]{background:#ff4d8d;color:#1a0b12;font-size:14px;font-weight:700}
#app[data-v="home"] #screen{padding-bottom:90px}
#app[data-v="home"] .nbadge{top:3px;right:6px}
.ctitlerow{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.ctitle{margin:0;font-size:30px;font-weight:700}
.csearch{display:none;margin-bottom:12px}
.csearch.open{display:flex}
.cstack{display:flex;flex-direction:column;padding-bottom:24px}
.cc{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:14px;height:168px;padding:16px 18px;border-radius:28px;margin-top:-86px;background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:0 -8px 20px rgba(0,0,0,.38);cursor:pointer;color:#fff}
.cc:first-child{margin-top:0}
.cc-av .cover{width:58px;height:58px;border-radius:50%;border:3px solid #fff}
.cc-meta{display:flex;flex-direction:column;gap:3px;min-width:0;padding-top:2px}
.cc-t{display:block;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-p{display:block;font-size:15px;color:rgba(255,255,255,.88);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-d{font-size:13px;color:rgba(255,255,255,.85);padding-top:4px}
.cc .ubadge{position:absolute;right:18px;top:44px;bottom:auto}
.cc-reply{position:absolute;left:16px;right:16px;bottom:22px;height:46px;border-radius:99px;background:#fff;color:#2a0f2a;font-weight:700;font-size:16px;display:grid;place-items:center}
.pback{padding:10px 10px 0}
.pv2{padding-top:6px}
.pcx{border-radius:28px;padding:22px;background:linear-gradient(120deg,#2b2b30 0%,#1b1812 55%,#2b1f0a 100%);border:1px solid #4a3a12;cursor:pointer}
.pcx-top{display:flex;align-items:center;justify-content:space-between}
.pcx-brand{font-family:var(--display);font-size:34px;color:#f5b300;font-weight:500}
.pcx-mid{display:flex;align-items:center;gap:16px;margin:18px 0 20px}
.pcx-chip{width:84px;height:62px;border-radius:12px;background:linear-gradient(135deg,#f3d27a,#b9811a);flex:none}
.pcx-mid small{display:block;font-size:13px;letter-spacing:3px;color:#bdb8b0}
.pcx-bal{display:block;font-size:56px;font-weight:700;letter-spacing:6px;line-height:1.05;color:#fff}
.pcx-bot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.pcx-id b{display:block;font-size:22px;letter-spacing:5px;color:#fff}
.pcx-id span{display:block;font-size:15px;color:#bdb8b0;margin-top:4px;word-break:break-all}
.pcx-av{width:64px;height:64px;border-radius:50%;border:4px solid #f5b300;font-size:26px;font-weight:700;color:#0b2a0b;flex:none}
.pbtn2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.pbtn2 button{height:54px;border-radius:99px;font-size:16px;font-weight:700}
.pbtn2 .gold{background:#f5b942;color:#2a1c00}
.pbtn2 .outl{border:2px solid #f5b942;color:#f5b942}
.pgrid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pitem{display:flex;align-items:center;gap:12px;height:56px;padding:0 14px;border-radius:18px;background:#121214;border:1px solid #242428;font-size:16px;font-weight:600;text-align:left;color:var(--text)}
.pitem svg{width:22px;height:22px;color:#f5b300;flex:none}
.pitem span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem.danger{background:#1c0d0d;border-color:#5a1f1f;color:#ff5850}
.pitem.danger svg{color:#ff5850}
/* coin store */
#app[data-v="coins"] #screen{background:#f4f5fb;color:#14151f;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y}
.cstore,.cstore *{box-sizing:border-box}
.cstore{display:flex;flex-direction:column;width:100%;max-width:100%;min-height:100%;min-height:calc(100dvh - var(--safe-t,0px));overflow-x:hidden;color:#14151f;touch-action:pan-y}
.cstore .chat-head{background:#f4f5fb;border-bottom:0;color:#14151f}
.cstore .chat-head .who b{color:#14151f}
.cstore .icon-btn{color:#14151f}
.cs-body{flex:1;min-width:0;padding:6px 20px 24px}
.cs-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#4a45e0;color:#fff;border-radius:28px;padding:24px 22px;margin-top:8px}
.cs-card>div{min-width:0}
.cs-card small{display:block;font-size:15px;color:rgba(255,255,255,.85)}
.cs-card b{display:block;font-size:clamp(38px,12vw,54px);line-height:1.05;font-weight:800;letter-spacing:-1px;margin-top:6px}
.coin.hexk.cs-hex{width:66px;height:66px;font-size:36px;flex:0 0 auto}
.cs-note{color:#5b5e70;font-size:14.5px;line-height:1.55;margin:18px 2px 0}
.cstore .sechead{margin:22px 0 14px}
.cstore .sechead h2{color:#14151f}
.cs-pack{display:block;width:100%;text-align:left;background:#fff;border:2px solid transparent;border-radius:18px;padding:14px 16px;margin-bottom:12px;color:#14151f;overflow:hidden;box-shadow:0 1px 2px rgba(20,21,50,.05)}
.cs-pack.on{border-color:#4a45e0}
.cs-row{display:flex;align-items:center;gap:12px;min-width:0}
.cs-rad{width:26px;height:26px;border-radius:50%;border:2px solid #c9ccd9;flex:0 0 auto;display:grid;place-items:center;background:#fff}
.cs-pack.on .cs-rad{background:#4a45e0;border-color:#4a45e0}
.cs-pack.on .cs-rad::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.coin.hexk.cs-hs{width:46px;height:46px;font-size:25px;flex:0 0 auto}
.cs-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cs-info b{font-size:clamp(20px,6.4vw,27px);font-weight:700;line-height:1.15;white-space:nowrap}
.cs-info b small{font-size:clamp(14px,4.3vw,18px);color:#6a6d7f;font-weight:500}
.cs-info span{color:#6a6d7f;font-size:15px}
.cs-price{font-size:clamp(19px,5.6vw,24px);font-weight:700;white-space:nowrap;flex:0 0 auto;color:#14151f}
.cs-buy{position:sticky;bottom:0;background:#fff;border-radius:26px 26px 0 0;padding:14px 20px calc(14px + var(--safe-b,0px));box-shadow:0 -6px 20px rgba(20,21,50,.06)}
.cs-btn{display:block;width:100%;height:58px;border:0;border-radius:16px;background:#11143a;color:#fff;font:inherit;font-size:19px;font-weight:700}
/* coin dark + profile sheet */
.cstore .icon-btn{width:44px;height:44px;border-radius:50%;background:#e7e8f3}
#app[data-v="coins"][data-cs="dk"] #screen{background:#0e0f14;color:#f3f4fa}
.cstore.dk{color:#f3f4fa}
.cstore.dk .chat-head{background:#0e0f14;color:#f3f4fa}
.cstore.dk .chat-head .who b,.cstore.dk .icon-btn{color:#f3f4fa}
.cstore.dk .icon-btn{background:#23242f}
.cstore.dk .cs-note,.cstore.dk .cs-info span,.cstore.dk .cs-info b small{color:#a4a7ba}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Photo URL ko CSS url("...") mein surakshit daalne ka tarika - agar URL mein
   khud ' ya " ho to bhi photo tootegi nahi. Pura style string banane ke baad
   ise hamesha esc() se HTML attribute ke liye bhi wrap karna. */
function cssUrl(u){ return 'url("' + String(u).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '")'; }
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function toast(m, ms){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), ms || 3600); }
let __errAt = 0;
function softFail(e){ try{ console.error(e); const n = Date.now(); if(n - __errAt > 4000){ __errAt = n; const m = String((e && ((e.code ? e.code + ': ' : '') + (e.message || e))) || 'error').slice(0, 110); toast('Kuch gadbad hui: ' + m, 7000); } }catch(_){} }
window.addEventListener('error', e => softFail(e.error || (e.message + ' @' + e.lineno)));
window.addEventListener('unhandledrejection', e => softFail(e.reason));

async function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  }
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
function fmt(t){
  /* * ke beech ka kuch bhi (AI ya user ka, kai line me bhi) narration banta hai; akeli bachi star bhi narration hi banati hai */
  return esc(String(t || '').trim()).replace(/\*{2,}/g, '*').split(/(\n\s*\n)/).map((p, i) => {
    if(i % 2 || p.indexOf('*') < 0) return p;
    if(((p.match(/\*/g) || []).length) % 2 === 1){
      if(p.endsWith('*')) p = p.startsWith('*') ? p.slice(0, -1).replace(/\s+$/, '') : '*' + p;
      else p += '*';
    }
    return p.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  }).join('');
}

const idb = {

  async get(k){ const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv','readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
};
function fileToDataUrl(file, max, q){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width * k), h = Math.round(img.height * k);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = () => rej(new Error('img')); img.src = fr.result;
    };
    fr.onerror = () => rej(new Error('read')); fr.readAsDataURL(file);
  });
}
function pickImages(multi){
  return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.multiple = !!multi; i.onchange = () => res([...i.files]); i.click(); });
}

  terms:"TERMS OF SERVICE (Kahaniyon)\nAakhri badlav: November 2026\n\nKahaniyon app istemal karne se pehle ye sharten dhyan se padho. App istemal karne ka matlab hai ki aap inhe maante ho.\n\n1. UMAR\nYe app sirf 18 saal ya usse zyada umar ke logon ke liye hai.\n\n2. AAPKA ACCOUNT\n- Aap Google ya Email-Password se login karte ho. Sahi jaankari do aur apna login surakshit rakho.\n- Aapke account se jo bhi hota hai, uski zimmedari aapki hai.\n- Ek insaan ek hi account banaye. Free coins lene ke liye nakli ya kai account banana mana hai.\n\n3. SEWA KYA HAI\nKahaniyon AI se chalne wali kaalpanik kahaniyon wali app hai. Characters asli insaan nahi hain aur kahaniyan asli logon ya ghatnaon se nahi judi hain. AI galti kar sakta hai ya ajeeb jawab de sakta hai. Ye koi daktari, kanooni ya paise ki salah nahi hai. Kisi sankat mein asli logon ya sahi sansthaon se madad lo.\n\n4. COINS\n- Coins app ke andar ka virtual saman hain. Inki koi naqad keemat nahi hai, inhe kisi ko diya ya becha nahi ja sakta.\n- Message bhejne par coins nahi kat'te. Coins sirf tab kat'te hain jab AI ka jawab aa jaye, aur har aise jawab ke 10 coins lagte hain. Aapka message aur AI ka jawab milkar ek message ginta hai, yani ek message ke kul 10 coins.\n- Dobara banao aur aage badhao par bhi AI ka naya jawab aane par 10 coins lagte hain.\n- Agar AI ka jawab nahi aata, to us jawab ke koi coins nahi kat'te.\n- Naye users ko kuch free coins mil sakte hain. Free coins ki ginti hum badal sakte hain.\n- Account band hone par bache hue coins khatam ho sakte hain (jaisa Refund Policy mein likha hai, uske alawa).\n\n5. PAYMENT\nCoins UPI se kharide jaate hain. Payment ke baad UTR (transaction ID) bhejna hota hai. Jaanch ke baad coins judte hain. Refund ke liye Refund Policy dekho.\n\n6. KYA MANA HAI\n- Kanoon ke khilaaf koi bhi kaam.\n- Nafrat, gaali-galoch, dhamki, pareshan karna ya kisi ki pehchaan chura kar dhokha dena.\n- Bachchon se jude koi bhi yaun ya nazuk content.\n- Doosron ki nijee jaankari bina ijazat daalna.\n- App ko hack karna, tod-phod karna, data copy karna ya reverse engineering.\n- Dhokhe se coins lena, jaise nakli accounts, nakli UTR ya payment mein gadbad.\n- AI ko galat content likhne ke liye majboor karne ki koshish, ya spam.\n\n7. AAPKA CONTENT AUR CHAT KA ISTEMAL\nAap jo messages likhte ho wo aapke hain. Aap hume unhe sirf in kaamon ke liye istemal karne ki ijazat dete ho:\n- App chalane ke liye: AI ka jawab banane ke liye aapke messages AI service ko bheje jaate hain.\n- Backup ke liye: aapki chats aur Story Memory cloud mein save karna, taaki naye phone par wapas mil sake.\n- Suraksha ke liye: galat istemal, dhokha ya sharton ke ulanghan ki jaanch aur support dene ke liye, jinke liye hum aapki chats dekh sakte hain.\n- App ko behtar banane ke liye: app ki galtiyan dhundna aur unhe theek karna.\nHum aapki chats ko vigyapan ke liye istemal nahi karte aur kisi ko bechte nahi (Privacy Policy dekho). Chat mein apne password, bank ya Aadhaar jaisi nazuk jaankari mat likho.\n\n8. AI KA CONTENT\nAI ke jawab kaalpanik hote hain. Hum nahi kehte ki wo sahi, poore ya aapke kaam ke layak hain.\n\n9. HAMARI MILKIYAT\nApp, uska design, kahaniyan aur characters hamare ya hamare licensor ke hain. Aap unhe bina likhit ijazat ke copy ya dobara istemal nahi kar sakte.\n\n10. SEWA MEIN BADLAV\nHum app mein feature badal, rok ya band kar sakte hain, maintenance ya kisi tech wajah se. Hum har samay bina ruke chalne ka vaada nahi karte.\n\n11. ACCOUNT BAND KARNA\nAgar aap in sharton ko todte ho, to hum aapka account rok ya band kar sakte hain. Aap bhi kabhi bhi app istemal karna band kar sakte ho aur apna data mitane ki maang Support se kar sakte ho.\n\n12. ZIMMEDARI KI SEEMA\nApp \"jaisi hai waisi\" di jaati hai. Kanoon ki seema mein, hum kisi bhi paroksh nuksaan ya data kho jaane ke liye zimmedar nahi hain. Kisi bhi haalat mein hamari adhiktam zimmedari us rakam tak hogi jo aapne pichhle 3 mahine mein app ko di ho. Is se aapke Consumer Protection kanoon ke adhikar prabhavit nahi hote.\n\n13. KANOON\nIn sharton par Bharat ke kanoon lagu honge. Koi vivad ho to pehle Support se baat karo. Na suljhe to Bharat ki adalat uska nirnay karengi.\n\n14. SHARTON MEIN BADLAV\nHum ye sharten badal sakte hain. Naya version isi jagah dikhega. Badlav ke baad app istemal karte rehna naye version ko maanna hai.\n\n15. SAMPARK\nKoi sawaal ho to app ke Profile mein \"Support\" mein diye gaye email ya WhatsApp link par hume likho.",
  privacy:"PRIVACY POLICY (Kahaniyon)\nAakhri badlav: November 2026\n\nHum aapki privacy ka dhyan rakhte hain. Yahan saaf likha hai ki hum kaun si jaankari lete hain, kyun lete hain, kahan rakhte hain, aur aap use kaise control kar sakte ho.\n\n1. HUM KAUN SI JAANKARI LETE HAIN\n- Login ki jaankari: Google ya Email-Password se login karne par aapka email, naam aur ek khaas user ID (Firebase Authentication ke zariye).\n- Jo aap khud daalte ho: naam, phone number (ye verify nahi hota) aur gender (optional).\n- Chat: aapke bheje messages, AI ke jawab aur \"Story Memory\" (purani kahani ka chhota saar jo AI ko yaad rakhne mein madad karta hai).\n- Coins aur payment: coins ki ginti, aur coins kharidne par payment ka record (naam, email, phone, pack, rakam aur UPI transaction ID/UTR). Agar aap payment ya refund ke liye Support ko payment ka screenshot bhejte ho (email ya WhatsApp se), to wo screenshot bhi hamare paas save hota hai.\n- Report: agar aap koi report bhejte ho to wo.\n- Ginti ke aankde: kahaniyon ki lokpriyata ginne ke liye chats ki ginti (isse aapki pehchaan nahi judi hoti).\n\n2. HUM ISE KYUN ISTEMAL KARTE HAIN\n- App chalane, login aur coins sambhalne ke liye.\n- Aapki chat aur Story Memory ko surakshit rakhne aur naye phone par wapas dene ke liye.\n- Payment aur refund ki jaanch aur support dene ke liye.\n- App ko surakshit rakhne aur galat istemal rokne ke liye.\n\n3. DATA KAHAN RAKHA JAATA HAI\n- Aapke phone mein: chats, settings aur theme.\n- Cloud mein (Google Firebase): login, coins, payments, reports aur chat ka backup (messages aur Story Memory).\n- Chat ka backup app ke malik ko support, suraksha aur galat istemal ki jaanch ke liye dikh sakta hai.\n- Payment ka screenshot (agar aap Support ko bhejte ho): hamare email ya WhatsApp mein, jahan aapne bheja.\n\n4. DUSRI SERVICES JO ISTEMAL HOTI HAIN\n- AI jawab banane ke liye aapke messages AI service ko bheje jaate hain (jaise Google Gemini, OpenAI, DeepSeek ya OpenRouter, jo bhi app use kare). Un par unki apni privacy policy lagti hai.\n- Awaaz se bolna ya sunna istemal karo to aapki awaaz ya text phone ki speech service ya awaaz banane wali service (jaise ElevenLabs) tak ja sakta hai.\n- Login aur database ke liye Google Firebase.\n\n5. PAYMENT\nCoins ki payment UPI se app ke bahar hoti hai. Hum aapka UPI PIN, bank ya card ki jaankari kabhi nahi lete. Hum sirf transaction ID, naam, email, phone, pack ka record aur (agar aap bhejo to) payment ka screenshot rakhte hain taaki payment ki jaanch aur refund ho sake.\n\n6. HUM DATA BECHTE NAHI\nHum aapki jaankari kisi ko bechte nahi aur vigyapan ke liye share nahi karte. Sirf upar likhi zaroori services (jaise AI aur Firebase) ko utna hi jaata hai jitna app chalane ke liye chahiye. Kanoon ya adalat ke kehne par jaankari dena pad sakta hai.\n\n7. DATA KITNE DIN RAKHA JAATA HAI AUR ACCOUNT DELETE HONE PAR KYA HOTA HAI\nJab tak aapka account aur app istemal mein hai, tab tak aapka data rakha jaata hai.\n- Aap chat ke menu se \"Delete Chat\" ya \"Replay\" (kahani dobara shuru) karke apni chat phone aur cloud backup dono se mita sakte ho. Kisi ek message ko delete karne par wo phone se aur (internet hone par) cloud backup se bhi hat jaata hai.\n- \"Account Settings\" mein \"Erase All Data\" se aapki saari chats aur Story Memory phone aur cloud backup dono se mit jaati hain, aur aap logout ho jaate ho. Isse aapka account, coins aur payment ka record nahi mitta.\n- \"Delete Chat\" ya \"Replay\" mein agar internet na ho to cloud se mitana baad mein internet aane par hota hai. \"Erase All Data\" ke liye internet chahiye.\n- Mitane ke baad backup mein sirf ek khaali nishaan (kahani ka naam aur mitane ka samay) reh sakta hai, aapki baatein nahi.\n- Account delete karne ki maang Support mein karo. Account delete hone par hum ye mita denge: aapka account aur login ki jaankari, aapka naam, phone number aur gender, aapki chats aur Story Memory (cloud backup), aur aapke coins ka record.\n- Ye record hamare paas rahenge: payment ke record (naam, email, phone, pack, rakam, UTR aur payment ka screenshot) aur doosre zaroori record jinhe kanoon, hisaab-kitaab (accounting) aur payment ki jaanch ke liye rakhna zaroori hai. Inhe sirf in kaamon ke liye rakha jaata hai.\n- Ye record kitne samay tak rakhe jaate hain, ye kanoon aur zaroorat ke hisaab se tay hota hai.\n\n8. SURAKSHA\nHum Firebase ke suraksha niyam aur surakshit connection (HTTPS) istemal karte hain. Par koi bhi system 100% surakshit nahi hota. Apna login surakshit rakho aur chat mein apne password, bank ya Aadhaar jaisi nazuk jaankari mat likho.\n\n9. BACHCHE\nYe app 18 saal se kam umar ke bachchon ke liye nahi hai.\n\n10. AAPKE ADHIKAR\nAap apni jaankari dekhne, sudharne ya mitane ki maang kar sakte ho. Iske liye app ke Profile mein \"Support\" kholkar diye gaye email ya WhatsApp link par hume likho. Jo record kanoon, accounting ya payment ki jaanch ke liye rakhna zaroori hai (hissa 7 dekho), unhe rakhna padega, par baaki jaankari mita di jaayegi. Aap apni chats khud bhi app se mita sakte ho (hissa 7 dekho).\n\n11. KAHANIYAN KAALPANIK HAIN\nApp ki kahaniyan aur AI ke jawab kaalpanik hain aur asli logon ya ghatnaon se nahi judi hain.\n\n12. POLICY MEIN BADLAV\nHum ye policy badal sakte hain. Naya version isi jagah dikhega. App istemal karte rehna naye version ko maanna hai.\n\n13. SAMPARK\nKoi sawaal ho to app ke Profile mein \"Support\" mein diye gaye email ya WhatsApp link par hume likho.",
  refund:"REFUND POLICY (Kahaniyon)\nAakhri badlav: November 2026\n\nYe policy coins ki kharid ke baare mein hai.\n\n1. MOOL NIYAM\nCoins digital (virtual) saman hain. Coins ki payment hone aur coins aapke account mein judne ke baad aam taur par refund nahi hota. Kharch ho chuke coins wapas nahi hote.\n\n2. JAB REFUND YA COINS MILENGE\nYe haalat mein hum jaanch ke baad ya to sahi coins jod denge ya paise wapas karenge:\n- Aapke paise kat gaye par coins nahi mile.\n- Ek hi payment do baar kat gayi.\n- Payment ki rakam ke hisaab se coins kam mile.\n- App ki tech galti se coins galat judne ya ghatne.\n\n3. AI KA JAWAB NA AANE PAR\nMessage bhejne par coins nahi kat'te. Coins sirf tab kat'te hain jab AI ka jawab sach mein aa jaye, aur har jawab ke 10 coins lagte hain (aapka message aur AI ka jawab milkar ek message). Agar jawab nahi aata, to us jawab ke koi coins nahi kat'te, isliye refund ki zaroorat nahi padti.\n\n4. JIN CHEEZON PAR REFUND NAHI\n- Kharch ho chuke coins.\n- Free coins ya muft mile coins (inka koi paisa nahi hota).\n- Galat ya nakli UTR bhejna, ya UTR jo pehle istemal ho chuka ho.\n- Sirf man badalne ya \"ab nahi chahiye\" ki wajah se.\n- Aapke account ko sharton ke ulanghan par band karna.\n- Aapke dwara galti se kisi aur UPI ID ya account mein payment karna.\n\n5. REFUND KAISE MAANGEIN\nPayment ke 7 din ke andar Profile mein \"Support\" kholkar diye gaye email ya WhatsApp link par ye jaankari bhejo:\n- UTR (transaction ID)\n- Payment ka screenshot\n- Aapka login email ya phone number\n- Kaunsa coin pack kharida tha aur kya dikkat hai\n\n6. KITNA SAMAY LAGEGA\nHum aapka request 7 din ke andar dekhenge. Agar refund manzoor hota hai, to paise usi tareeke (UPI) se wapas aate hain jisse payment hui thi. Bank ke hisaab se 5 se 10 kaam ke din lag sakte hain.\n\n7. GALAT DAAVE\nJhoote ya dhokhe wale refund request par hum account band kar sakte hain.\n\n8. AAPKE ADHIKAR\nIs policy se Bharat ke Consumer Protection kanoon ke tahat aapke adhikar prabhavit nahi hote. 7 din ki samay seema sirf hamari is policy ke tahat refund request bhejne ke liye hai. Ye samay seema khatam hone par bhi kanoon ke tahat aapke adhikar barkarar rehte hain.\n\n9. SAMPARK\nKoi sawaal ho to app ke Profile mein \"Support\" mein diye gaye email ya WhatsApp link par hume likho.",
  termsEn:"TERMS OF SERVICE (Kahaniyon)\nLast updated: November 2026\n\nPlease read these terms carefully before using Kahaniyon. By using the app, you agree to them.\n\n1. AGE\nThis app is only for people who are 18 years of age or older.\n\n2. YOUR ACCOUNT\n- You log in with Google or Email-Password. Give correct information and keep your login secure.\n- You are responsible for everything that happens through your account.\n- One person should create only one account. Creating fake or multiple accounts to get free coins is not allowed.\n\n3. WHAT THE SERVICE IS\nKahaniyon is an app of fictional stories powered by AI. The characters are not real people, and the stories are not connected to real people or events. AI can make mistakes or give strange replies. This is not medical, legal or financial advice. In an emergency, contact real people or proper authorities for help.\n\n4. COINS\n- Coins are virtual items inside the app. They have no cash value and cannot be given or sold to anyone.\n- No coins are deducted when you send a message. Coins are deducted only when the AI's reply arrives, and each such reply costs 10 coins. Your message and the AI's reply together count as one message, so one message costs 10 coins in total.\n- Regenerating a reply or continuing the story also costs 10 coins when the new AI reply arrives.\n- If the AI's reply does not arrive, no coins are deducted for it.\n- New users may receive some free coins. We may change the number of free coins.\n- When an account is closed, the remaining coins may be lost (except as stated in the Refund Policy).\n\n5. PAYMENT\nCoins are bought through UPI. After paying, you must send the UTR (transaction ID). Coins are added after we verify the payment. See the Refund Policy for refunds.\n\n6. WHAT IS NOT ALLOWED\n- Any activity that is against the law.\n- Hate, abuse, threats, harassment, or pretending to be someone else to deceive people.\n- Any sexual or sensitive content involving children.\n- Sharing other people's personal information without permission.\n- Hacking, damaging, copying data from, or reverse engineering the app.\n- Getting coins through fraud, such as fake accounts, fake UTRs or payment tricks.\n- Trying to force the AI to write prohibited content, or sending spam.\n\n7. YOUR CONTENT AND HOW YOUR CHATS ARE USED\nThe messages you write belong to you. You allow us to use them only for these purposes:\n- To run the app: your messages are sent to an AI service to create the AI's reply.\n- For backup: saving your chats and Story Memory in the cloud so they can be restored on a new phone.\n- For safety: checking misuse, fraud or breaking of these terms, and giving support, for which we may view your chats.\n- To improve the app: finding and fixing errors in the app.\nWe do not use your chats for advertising and we do not sell them (see the Privacy Policy). Do not write sensitive information such as passwords, bank details or Aadhaar numbers in chats.\n\n8. AI CONTENT\nAI replies are fictional. We do not say that they are correct, complete or suitable for your needs.\n\n9. OUR PROPERTY\nThe app, its design, stories and characters belong to us or our licensors. You may not copy or reuse them without written permission.\n\n10. CHANGES TO THE SERVICE\nWe may change, pause or stop features of the app, for maintenance or technical reasons. We do not promise that the app will run without interruption at all times.\n\n11. CLOSING AN ACCOUNT\nIf you break these terms, we may suspend or close your account. You may stop using the app at any time and ask Support to delete your data.\n\n12. LIMIT OF LIABILITY\nThe app is provided \"as is\". To the extent allowed by law, we are not responsible for any indirect loss or loss of data. In any case, our maximum liability will be limited to the amount you paid to the app in the last 3 months. This does not affect your rights under consumer protection laws.\n\n13. GOVERNING LAW\nThese terms are governed by the laws of India. If there is a dispute, please talk to Support first. If it is not resolved, the courts of India will decide it.\n\n14. CHANGES TO THESE TERMS\nWe may change these terms. The new version will appear here. Continuing to use the app after a change means you accept the new version.\n\n15. CONTACT\nIf you have any questions, write to us using the email or WhatsApp link given under \"Support\" in the app's Profile.",
  privacyEn:"PRIVACY POLICY (Kahaniyon)\nLast updated: November 2026\n\nWe care about your privacy. This explains clearly what information we collect, why we collect it, where we keep it, and how you can control it.\n\n1. WHAT INFORMATION WE COLLECT\n- Login information: When you log in with Google or Email-Password, your email, name and a unique user ID (through Firebase Authentication).\n- What you enter yourself: your name, phone number (this is not verified) and gender (optional).\n- Chats: the messages you send, the AI's replies and the \"Story Memory\" (a short summary of the earlier story that helps the AI remember).\n- Coins and payments: your coin balance and, when you buy coins, a payment record (name, email, phone, pack, amount and UPI transaction ID/UTR). If you send a screenshot of your payment to Support (by email or WhatsApp) for payment checking or a refund, that screenshot is also saved with us.\n- Reports: any report you send.\n- Counts: counts of chats, used to see which stories are popular (these are not linked to your identity).\n\n2. WHY WE USE IT\n- To run the app, handle login and manage coins.\n- To keep your chats and Story Memory safe and give them back on a new phone.\n- To check payments and refunds and give support.\n- To keep the app safe and prevent misuse.\n\n3. WHERE DATA IS STORED\n- On your phone: chats, settings and theme.\n- In the cloud (Google Firebase): login, coins, payments, reports and the chat backup (messages and Story Memory).\n- The chat backup may be visible to the app owner for support, safety and checking misuse.\n- A payment screenshot (if you send one to Support): in our email or WhatsApp, where you sent it.\n\n4. OTHER SERVICES WE USE\n- To create AI replies, your messages are sent to an AI service (such as Google Gemini, OpenAI, DeepSeek or OpenRouter, whichever the app uses). Their own privacy policies apply.\n- If you use voice input or voice playback, your voice or text may go to your phone's speech service or a voice service (such as ElevenLabs).\n- Google Firebase is used for login and the database.\n\n5. PAYMENTS\nCoin payments are made through UPI outside the app. We never collect your UPI PIN, bank or card details. We only keep the transaction ID, name, email, phone, the pack record and (if you send it) a screenshot of the payment, so that the payment can be checked and refunds can be handled.\n\n6. WE DO NOT SELL DATA\nWe do not sell your information to anyone and do not share it for advertising. It goes only to the necessary services listed above (such as AI and Firebase), and only as much as is needed to run the app. We may have to share information if required by law or by a court.\n\n7. HOW LONG DATA IS KEPT AND WHAT HAPPENS WHEN AN ACCOUNT IS DELETED\nYour data is kept as long as your account and the app are in use.\n- From the chat menu you can use \"Delete Chat\" or \"Replay\" (restart the story) to remove a chat from both your phone and the cloud backup. If you delete a single message, it is removed from your phone and, when you are online, from the cloud backup too.\n- In \"Account Settings\", \"Erase All Data\" deletes all your chats and Story Memory from both your phone and the cloud backup, and logs you out. It does not delete your account, coins or payment records.\n- For \"Delete Chat\" or \"Replay\", if you are offline the cloud deletion is completed later when you are online. \"Erase All Data\" needs internet.\n- After deletion, an empty marker (the story name and the deletion time) may remain in the backup, not your conversation.\n- Ask Support to delete your account. When your account is deleted, we will delete: your account and login information, your name, phone number and gender, your chats and Story Memory (cloud backup), and your coin record.\n- These records will stay with us: payment records (name, email, phone, pack, amount, UTR and payment screenshot) and other necessary records that we must keep for legal, accounting and payment verification purposes. They are kept only for these purposes.\n- How long these records are kept is decided according to the law and need.\n\n8. SECURITY\nWe use Firebase security rules and secure connections (HTTPS). But no system is 100% secure. Keep your login safe and do not write sensitive information such as passwords, bank details or Aadhaar numbers in chats.\n\n9. CHILDREN\nThis app is not for children under 18.\n\n10. YOUR RIGHTS\nYou can ask to see, correct or delete your information. To do this, open \"Support\" in the app's Profile and write to us at the email or WhatsApp link given there. Records that must be kept for legal, accounting or payment verification purposes (see section 7) must stay with us, but the rest of your information will be deleted. You can also delete your chats yourself from the app (see section 7).\n\n11. THE STORIES ARE FICTIONAL\nThe app's stories and AI replies are fictional and are not connected to real people or events.\n\n12. CHANGES TO THIS POLICY\nWe may change this policy. The new version will appear here. Continuing to use the app means you accept the new version.\n\n13. CONTACT\nIf you have any questions, write to us using the email or WhatsApp link given under \"Support\" in the app's Profile.",
  refundEn:"REFUND POLICY (Kahaniyon)\nLast updated: November 2026\n\nThis policy is about buying coins.\n\n1. BASIC RULE\nCoins are digital (virtual) items. Once the payment is made and the coins are added to your account, they are generally not refundable. Coins that have been used cannot be returned.\n\n2. WHEN YOU WILL GET A REFUND OR COINS\nIn these situations, after checking, we will either add the correct coins or return your money:\n- Your money was deducted but you did not receive the coins.\n- The same payment was deducted twice.\n- You received fewer coins than the payment amount should give.\n- Coins were wrongly added or deducted because of a technical error in the app.\n\n3. WHEN THE AI'S REPLY DOES NOT ARRIVE\nNo coins are deducted when you send a message. Coins are deducted only when the AI's reply actually arrives, and each reply costs 10 coins (your message and the AI's reply together count as one message). If the reply does not arrive, no coins are deducted for it, so no refund is needed.\n\n4. WHAT IS NOT REFUNDED\n- Coins that have been used.\n- Free coins (they have no money value).\n- Sending a wrong or fake UTR, or a UTR that has already been used.\n- Changing your mind, or \"I don't want it anymore\".\n- Closing your account for breaking the terms.\n- Paying by mistake to some other UPI ID or account.\n\n5. HOW TO ASK FOR A REFUND\nWithin 7 days of the payment, open \"Support\" in your Profile and send the following to the email or WhatsApp link given there:\n- UTR (transaction ID)\n- A screenshot of the payment\n- Your login email or phone number\n- Which coin pack you bought and what the problem is\n\n6. HOW LONG IT TAKES\nWe will look at your request within 7 days. If a refund is approved, the money is returned the same way (UPI) as the payment. Depending on your bank, it may take 5 to 10 working days.\n\n7. FALSE CLAIMS\nWe may close accounts for false or fraudulent refund requests.\n\n8. YOUR RIGHTS\nThis policy does not affect your rights under India's consumer protection laws. The 7-day period applies only to sending a refund request under this policy. Your rights under the law remain even after this period ends.\n\n9. CONTACT\nIf you have any questions, write to us using the email or WhatsApp link given under \"Support\" in the app's Profile.",
  faq:[

const validCount = c => ((c && c.messages) || []).filter(m => m && !m.err && (m.r === 'u' || m.t)).length;
function mergeCloudChat(id, cc){
  const cdel = Number(cc && cc.deleted) || 0, tl = Number((S.tomb || {})[id]) || 0;
  if(cc && (cdel || tl)){
    const lim = Math.max(cdel, tl), up = Number(cc.updated) || 0;
    if(!(Array.isArray(cc.messages) && cc.messages.length && up > lim)){
      const lx = S.chats[id];
      if(lx && Array.isArray(lx.messages) && lx.messages.length && (Number(lx.updated) || 0) <= lim){ delete S.chats[id]; return 'del'; }
      return false;
    }
  }
  if(!cc || !Array.isArray(cc.messages) || !cc.messages.length) return false;
  const dropped = Number(cc.dropped) || 0;
  const cUp = Math.max(0, (cc.memUpTo || 0) - dropped);
  const lc = S.chats[id];
  if(!lc || !Array.isArray(lc.messages) || !lc.messages.length){
    S.chats[id] = Object.assign({}, lc || {}, {messages: cc.messages, updated: cc.updated || Date.now(), memory: cc.memory || (lc && lc.memory) || '', memUpTo: cc.memory ? cUp : ((lc && lc.memUpTo) || 0)});
    return true;
  }
  const cn = validCount(cc), ln = validCount(lc);
  const cloudWins = cn > ln || (cn === ln && (cc.updated || 0) > (lc.updated || 0));
  let changed = false;
  if(cloudWins){
    const keepOld = !!lc.memory && (!cc.memory || (lc.memUpTo || 0) > cUp) && (lc.memUpTo || 0) <= cn;
    lc.messages = cc.messages; lc.updated = Math.max(cc.updated || 0, lc.updated || 0);
    if(!keepOld && cc.memory){ lc.memory = cc.memory; lc.memUpTo = cUp; }
    if((lc.memUpTo || 0) > cn) lc.memUpTo = cn;
    changed = true;
  } else if(cc.memory && (!lc.memory || (cc.memUpTo || 0) > (lc.memUpTo || 0)) && (cc.memUpTo || 0) <= ln){

}
const tombKey = () => 'kcs2.tomb.' + (S.user ? S.user.uid : 'guest');

function addTomb(ids, ts){ const t = store.get(tombKey(), {}) || {}; ids.forEach(id => { t[id] = ts; }); store.set(tombKey(), t); S.tomb = t; }
async function flushTombs(){

  const key = tombKey(), tomb = store.get(key, {}) || {}, ids = Object.keys(tomb);
  if(!ids.length) return {ok:true, none:true};

    const snap = await FB.db.collection('chatlogs').where('uid', '==', S.user.uid).get();
    const chats = {}; ids.forEach(id => { chats[id] = tombEntry(id, tomb[id]); });
    const jobs = []; snap.forEach(d => { jobs.push(d.ref.set({chats: chats, updatedAt: Date.now()}, {merge: true})); });
    await Promise.all(jobs);
    const cur = store.get(key, {}) || {};

      jobs.push(d.ref.set({chats: chats, name: '', updatedAt: ts}, {merge: true}));
    });
    await Promise.all(jobs);
    store.del(tombKey()); S.tomb = {};
    return {ok:true};
  }catch(e){ return {ok:false, err:e}; }
}
async function doLoad(loud){
  if(!FB.ready || !S.user) return {ok:false, nologin:true};
  const uid = S.user.uid;
  try{
    S.tomb = store.get(tombKey(), {}) || {};
    const snap = await FB.db.collection('chatlogs').where('uid', '==', uid).get();
    let changed = 0, removed = 0;
    snap.forEach(d => { const chats = (d.data() || {}).chats || {}; Object.keys(chats).forEach(id => { const r = mergeCloudChat(id, chats[id]); if(r === 'del') removed++; else if(r) changed++; }); });
    S.cloudLoaded = uid;
    if(changed || removed){
      store.set('kcs2.chats', S.chats);
      try{ updateBadges(); }catch(_){}
      if(['home', 'chats', 'profile'].indexOf(S.view) >= 0 && !S.ov) render();
      if(changed) toast('Purani chats aur Story Memory cloud se wapas aa gayi (' + changed + ' chat)', 5000);
    }
    queueSync(() => flushTombs());
    return {ok:true, changed};
  }catch(e){
    if(e && e.code === 'permission-denied'){ S.cloudLoaded = uid; console.warn('cloud restore: Firestore rules abhi isse allow nahi karte'); return {ok:false, denied:true, err:e}; }
    reportSyncErr(e, !!loud);
    return {ok:false, err:e};
  }
}
const CLOUD_KEEPS = [0, 200, 120, 80, 50, 30, 20, 12];
function cloudChats(keep){
  const chats = {};
  Object.keys(S.chats).forEach(id => {
    const c = S.chats[id], s = story(id);
    if(!s || !c || !c.messages || !c.messages.length) return;
    let list = c.messages.filter(m => !m.err), dropped = 0;
    if(keep){
      const valid = list.filter(m => m.r === 'u' || m.t);
      if(valid.length > keep){ dropped = valid.length - keep; list = valid.slice(-keep); }
    }
    const e = {title: s.title, updated: c.updated, messages: list, dropped: dropped};
    if(c.memory){ e.memory = c.memory; e.memUpTo = c.memUpTo || 0; }
    chats[id] = e;
  });
  return chats;
}
async function doSync(now){
  const phone = phoneKey(S.set.phone);
  if(!FB.ready || !phone) return {ok:false, skipped:true};
  const loud = now === true || now === 'memory';
  if(S.user && S.cloudLoaded !== S.user.uid){
    const r = await doLoad(false);
    if(!r.ok && !r.denied){ if(loud) reportSyncErr(r.err, true); return {ok:false, err:r.err}; }
  }
  await flushTombs();
  for(let i = 0; i < CLOUD_KEEPS.length; i++){
    const chats = cloudChats(CLOUD_KEEPS[i]);
    if(!Object.keys(chats).length) return {ok:true, empty:true};
    const payload = {name:S.set.name, phone, uid:(S.user ? S.user.uid : ''), updatedAt:Date.now(), chats};
    if(S.user && S.user.email) payload.email = S.user.email.toLowerCase();
    if(JSON.stringify(payload).length > 700000) continue;
    try{
      await FB.db.collection('chatlogs').doc(phone).set(payload, {merge:true});
      if(now === true) toast('Chat backup cloud par ho gaya');
      else if(now === 'memory') toast('Story ki yaad cloud par save ho gayi');
      return {ok:true, kept:CLOUD_KEEPS[i]};
    }catch(e){
      const big = e && e.code === 'invalid-argument' && /size|exceed|large/i.test(String(e.message || ''));
      if(!big){ reportSyncErr(e, loud); return {ok:false, err:e}; }
    }
  }
  const er = new Error('toolarge'); er.code = 'toolarge';
  reportSyncErr(er, loud);
  return {ok:false, err:er};
}
function loadMyChats(loud){ return queueSync(() => doLoad(loud)); }

}

  if(t.value.length - sel + add > MSG_MAX && e.cancelable) e.preventDefault();

let heroTimer = null;
function bindHeroDots(){
  const rail = document.querySelector('.herorail'), dots = document.querySelectorAll('.hdots .hd');
  if(!rail || !dots.length) return;
  rail.addEventListener('scroll', () => { const f = rail.firstElementChild; const w = f ? f.getBoundingClientRect().width + 14 : 1; const i = Math.min(dots.length - 1, Math.round(rail.scrollLeft / w)); dots.forEach((d, k) => d.classList.toggle('on', k === i)); }, {passive: true});
}
function stopHeroAuto(){ if(heroTimer){ clearInterval(heroTimer); heroTimer = null; } }
function startHeroAuto(){
  const rail = document.querySelector('.herorail'); if(!rail || rail.children.length < 2) return;
  heroTimer = setInterval(() => {
    if(!document.body.contains(rail)){ stopHeroAuto(); return; }
    const card = rail.firstElementChild; if(!card) return;
    const step = card.getBoundingClientRect().width + 14;
    const max = rail.scrollWidth - rail.clientWidth;
    const next = rail.scrollLeft + step >= max - 5 ? 0 : rail.scrollLeft + step;
    rail.scrollTo({left: next, behavior:'smooth'});
  }, 2000);
}
function go(view, extra){

function parseFbConfig(text){
  let t = (text || '').trim();
  t = t.replace(/^\s*(?:export\s+)?(?:const|let|var)\s+\w+\s*=\s*/, '').replace(/;\s*$/, '');
  t = t.replace(/([{,]\s*)([A-Za-z0-9_$]+)\s*:/g, '$1"$2":').replace(/'/g, '"').replace(/,\s*}/g, '}');
  const cfg = JSON.parse(t);
  if(!cfg.apiKey || !cfg.projectId) throw new Error('bad');
  return cfg;
}
function initFirebase(cfg){

      toast(why); return false;
    }
    if(!FB.app) FB.app = firebase.initializeApp(cfg);
    FB.auth = firebase.auth(); FB.db = firebase.firestore(); try{ FB.db.settings({experimentalAutoDetectLongPolling:true}); }catch(e){} FB.ready = true;
    FB.auth.onAuthStateChanged(u => { const wasChecked = !!S.authChecked; S.user = u; watchCoins(); S.authChecked = true; if(u) loadMyChats(wasChecked); else S.cloudLoaded = null; if(S.ov === 'sheet') showOv('sheet', accountSection() + settingsButtons()); else render(); });

}

function tidyReply(text, c, cur){
  try{
    const split = t => String(t).replace(/\r/g, '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
    const words = p => p.toLowerCase().replace(/[*_.,!?"'()\-:;\u2014\u2026\u201c\u201d\u2018\u2019]/g, ' ').split(/\s+/).filter(Boolean);
    /* 1) narration hamesha theek *...* mein */
    let paras = split(text).map(p => {
      p = p.replace(/\*{2,}/g, '*');
      const n = (p.match(/\*/g) || []).length, one = s => s.replace(/\s*\n\s*/g, ' ');
      if(n === 0 && /^\([^()]+\)$/.test(p)) return '*' + one(p.slice(1, -1).trim()) + '*';
      if(n === 0 && /^_[^_]+_$/.test(p)) return '*' + one(p.slice(1, -1).trim()) + '*';
      if(n === 2 && p.startsWith('*') && p.endsWith('*')) return one(p);
      if(n === 1 && p.startsWith('*')) return one(p) + '*';
      if(n === 1 && p.endsWith('*')) return '*' + one(p);
      return p;
    });
    /* 2) pichhle jawab ya isi jawab ki dohrai hui baat hatao */
    const prev = [];
    if(c && Array.isArray(c.messages)){
      c.messages.filter(x => x !== cur && x.r === 'a' && x.t).slice(-2).forEach(x => split(x.t).forEach(q => { const w = words(q); if(w.length >= 5) prev.push(new Set(w)); }));
    }
    const kept = [];
    const jac = (a, b) => { let i = 0; a.forEach(x => { if(b.has(x)) i++; }); return i / (a.size + b.size - i); };
    const cont = (a, b) => { let i = 0; a.forEach(x => { if(b.has(x)) i++; }); return i / a.size; };
    for(const p of paras){
      const ws = new Set(words(p));
      if(ws.size < 5){ kept.push({p: p, set: ws}); continue; }
      if(prev.some(s => jac(ws, s) >= 0.8 || (ws.size >= 8 && cont(ws, s) >= 0.9))) continue;
      let dup = false;
      for(const k of kept){
        if(k.set.size < 5) continue;
        if(ws.size > k.set.size && (jac(ws, k.set) >= 0.8 || (k.set.size >= 8 && cont(k.set, ws) >= 0.9))){ k.p = p; k.set = ws; dup = true; break; }
        if(jac(ws, k.set) >= 0.8 || (ws.size >= 8 && cont(ws, k.set) >= 0.9)){ dup = true; break; }
      }
      if(!dup) kept.push({p: p, set: ws});
    }
    const out = kept.map(k => k.p).join('\n\n').trim();
    return out || String(text).trim();
  }catch(e){ return text; }
}
function stripUserParts(text){
  try{
    const nm = String((S.set && S.set.name) || '').trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const lab = new RegExp('^\\s*\\**\\s*(?:tum|user|you|aap' + (nm ? '|' + nm : '') + ')\\s*\\**\\s*[:：]', 'i');
    const out = String(text).split('\n').filter(l => !lab.test(l)).join('\n').replace(/\n{3,}/g, '\n\n').trim();
    return out || text;
  }catch(e){ return text; }
}

async function ai(id, hidden){
  if(S.busyChats[id]) return;
  if(gate()) return;
  const s = story(id), c = S.chats[id];
  if(!S.set.key){ aiNotReady(); return; }
  if(!coinOk()) return;
  if(hidden) c.messages.push({r:'u', t:hidden, h:1, id:rid()});
  const m = {r:'a', t:'', id:rid()}; c.messages.push(m);
  S.busyChats[id] = {mid: m.id, at: Date.now()};
  c.updated = Date.now(); if(S.chatId === id){ S.tray = null; paintTray(); } paintMsgs(id, true);
  const history = buildHistory(s, c, m);
  const MAX_TRY = 5, BACKOFF = [600, 1200, 2000, 3000];
  for(let attempt = 0; attempt < MAX_TRY; attempt++){
    try{
      const full = await streamCompletion(systemPrompt(s, c), history, () => {});
      if(!full.trim()) throw new Error('AI ne kuch nahi likha. Dobara koshish karo.');
      { const t1 = tidyReply(stripUserParts(full), c, m); m.t = (s.narr === false) ? dropNarration(t1) : t1; } m.err = null; chargeExchange(c); break;
    }catch(e){
      if(isTransient(e) && attempt < MAX_TRY - 1 && !(e.timeout && attempt >= 1)){
        m.t = ''; m.retrying = true; paintMsgs(id);
        await wait(BACKOFF[attempt] || 8000);
        continue;
      }
      m.t = ''; m.retrying = false;
      m.err = (e instanceof TypeError) ? 'AI se connect nahi ho paya. Internet check karo. Agar browser seedha call block kar raha hai to Settings mein apne backend proxy ka URL daalo.' : e.message;
      break;
    }
  }
  m.retrying = false;
  delete S.busyChats[id]; c.updated = Date.now(); saveChats(); paintMsgs(id); syncAct();
  if(!m.err && (m.t || '').trim() && !(S.view === 'chat' && S.chatId === id)){
    S.unread[id] = (S.unread[id] || 0) + 1; saveUnread(); updateBadges();
    if(S.view === 'chats'){ const sc = $('#screen'), st = sc.scrollTop; render(); sc.scrollTop = st; }
  }
  maybeSummarize(id);
  const qi = S.queue.indexOf(id);
  if(qi >= 0){
    S.queue.splice(qi, 1);
    if(S.chats[id]){ S.chats[id].messages = S.chats[id].messages.filter(x => !x.err); setTimeout(() => ai(id), 80); }
  }
}
function truncateAfter(mid){

  const idx = c.messages.findIndex(m => m.id === mid);
  if(idx === -1) return -1;
  c.messages = c.messages.slice(0, idx + 1);
  return idx;
}

  text = (text || '').trim(); if(!text) return;

  c.messages = c.messages.filter(m => !m.err);

  if(S.busy){ if(!S.queue.includes(S.chatId)) S.queue.push(S.chatId); paintMsgs(S.chatId, true); } else ai(S.chatId);

  if(S.tray && !S.tray.loading){ S.tray = null; paintTray(); return; }

  S.tray = {loading:true, items:[]}; paintTray();
